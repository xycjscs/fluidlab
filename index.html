====================================================================== */
const AutoDirector = {
  nextBurst: 0, nextDrop: 0, nextStreet: 0, nextVortex: 0, nextJet: 0, nextDemo: 0, vortexIdx: 0,

  setMode(modeId, nowMs) {
    this.resetTimers(nowMs);
  },
  resetTimers(nowMs) {
    const now = nowMs != null ? nowMs : performance.now();
    const m = MODES[mode] || MODES.free;
    this.vortexIdx = 0;
    const inj = m.injector || {};
    if (mode === 'fireworks') this.nextBurst = now + (inj.firstBurstDelay != null ? inj.firstBurstDelay : 0.08) * 1000;
    if (mode === 'rain') this.nextDrop = now + 100;
    if (mode === 'street') this.nextStreet = now + 100;
    if (mode === 'vortex') this.nextVortex = now + 100;
    if (mode === 'jet') this.nextJet = now + 100;
    if (mode === 'free') this.nextDemo = now + 2500;
  },

  update(dt, nowMs) {
    const f = IMPULSE_K * simScale();
    switch (mode) {
      case 'free': {
        if (nowMs >= this.nextDemo) {
          const x = 0.25 + Math.random() * 0.50, y = 0.25 + Math.random() * 0.50;
          const a = Math.random() * Math.PI * 2, force = 0.30 + Math.random() * 0.30;
          const seed = 0.1 + Math.random() * 0.8;
          splat(x, y, Math.cos(a) * force * f, Math.sin(a) * force * f, 0.22, 0, seed, 0.014);
          this.nextDemo = nowMs + 2500 + Math.random() * 500;
        }
        break;
      }
      case 'street': {
        /* 7 行全高度注染 (对齐 v3 标定: 每行独立位置抖动+色相漂移 → 全高度尾流)
           xhigh 第5轮: force 0.10f→0.22f (0.53→1.17 格/秒, 对齐 v3 的 1.77 量级) */
        while (nowMs >= this.nextStreet) {
          const rows = 7;
          const t = nowMs * 0.0006;
          for (let k = 0; k < rows; k++) {
            const y = 0.07 + k * (0.86 / (rows - 1)) + 0.015 * Math.sin(t + k * 1.9);
            const seed = clamp(0.5 + 0.3 * Math.sin(t * 0.7 + k * 0.9), 0.1, 0.9);
            splat(0.03, y, 0.22 * f, 0, 0.45 * f, 0, seed, 0.012);
          }
          this.nextStreet += 17;
          if (nowMs - this.nextStreet > 1000) { this.nextStreet = nowMs + 17; break; }
        }
        break;
      }
      case 'fireworks': {
        if (nowMs >= this.nextBurst) {
          const inj = MODES.fireworks.injector;
          const cx = inj.xMin + Math.random() * (inj.xMax - inj.xMin);
          const cy = inj.yMin + Math.random() * (inj.yMax - inj.yMin);
          for (let i = 0; i < inj.rays; i++) {
            const a = (i / inj.rays) * Math.PI * 2 + Math.random() * 0.18;
            const seed = 0.15 + 0.7 * ((i * 0.618 + Math.random() * 0.1) % 1);
            splat(cx + Math.cos(a) * 0.018, cy + Math.sin(a) * 0.018,
                  Math.cos(a) * inj.rayForce * f, Math.sin(a) * inj.rayForce * f,
                  inj.rayDye, 0, seed, inj.rayRadius);
          }
          splat(cx, cy, 0, 0, inj.centerDye, 0, 0.5, inj.centerRadius);
          this.nextBurst = nowMs + (inj.min + Math.random() * (inj.max - inj.min)) * 1000;
        }
        break;
      }
      case 'rain': {
        while (nowMs >= this.nextDrop) {
          const x = Math.random(), seed = 0.5 + Math.random() * 0.4;
          splat(x, 0.015 + Math.random() * 0.01, 0, MODES.rain.injector.forceY * f,
                MODES.rain.injector.dye, 0, seed, MODES.rain.injector.radius);
          this.nextDrop += 100;
          if (nowMs - this.nextDrop > 500) { this.nextDrop = nowMs + 100; break; }
        }
        break;
      }
      case 'vortex': {
        while (nowMs >= this.nextVortex) {
          const inj = MODES.vortex.injector;
          const idx = this.vortexIdx % inj.emitters;
          const ang = (idx / inj.emitters) * Math.PI * 2 + Math.sin(nowMs * 0.0003) * 0.05;
          const x = 0.5 + Math.cos(ang) * inj.ringRadius;
          const y = 0.5 + Math.sin(ang) * inj.ringRadius;
          const tx = -Math.sin(ang), ty = Math.cos(ang);
          const seed = 0.2 + 0.6 * ((idx * 0.13) % 1);
          splat(x, y, tx * inj.force * f, ty * inj.force * f, inj.dye, 0, seed, inj.radius);
          this.vortexIdx++;
          this.nextVortex += 160;
          if (nowMs - this.nextVortex > 500) { this.nextVortex = nowMs + 160; break; }
        }
        break;
      }
      case 'jet': {
        while (nowMs >= this.nextJet) {
          const inj = MODES.jet.injector;
          splat(inj.left.x, inj.left.y, inj.force * f, 0, inj.dye, 0, 0.30, inj.radius);
          splat(inj.right.x, inj.right.y, -inj.force * f, 0, inj.dye, 0, 0.75, inj.radius);
          this.nextJet += 120;
          if (nowMs - this.nextJet > 500) { this.nextJet = nowMs + 120; break; }
        }
        break;
      }
    }
  },

  /* 预热: 模式启动前跑 N 个子步 (wind + inject + dye advect), 首屏就有内容 */
  prime(seconds) {
    const steps = Math.max(1, Math.min(90, Math.round(seconds * 30)));
    const dt = clamp(seconds / steps, 0.008, 1/30);
    const tx = velocity.texelSizeX, ty = velocity.texelSizeY;
    for (let i = 0; i < steps; i++) {
      const now = performance.now();
      updateWind(dt);
      applyWindPass(dt);
      AutoDirector.update(dt, now);
      /* dye advect only */
      advectP.bind();
      const u = advectP.uniforms;
      gl.uniform2f(u.fVelTexel, tx, ty);
      gl.uniform2f(u.fDyeTexelSize, dye.texelSizeX, dye.texelSizeY);
      gl.uniform1f(u.dt, dt);
      gl.uniform1f(u.dissipation, config.DENSITY_DISSIPATION);
      gl.uniform1f(u.uField, 1.0);
      gl.uniform1f(u.uVOff, Q.vOff); gl.uniform1f(u.uVSpan, Q.vSpan); gl.uniform1f(u.uVMax, Q.vMax);
      gl.uniform1f(u.uDyeClamp, Q.dyeClamp);
      gl.uniform1i(u.uObstacle, obstacleFBO.attach(2));
      gl.uniform1i(u.uVelocity, velocity.read.attach(0));
      gl.uniform1i(u.uSource, dye.read.attach(1));
      blit(dye.write); dye.swap();
    }
  }
};

/* ======================================================================
   step: v3 标准 Stam 顺序 + 统一风场 pass
====================================================================== */
function applyWindPass(dt) {
  windP.bind();
  const u = windP.uniforms;
  const c = windState.cur;
  gl.uniform2f(u.uBaseWind, c.baseX, c.baseY);
  gl.uniform1f(u.uVortexMode, c.vortexOn);
  gl.uniform2f(u.uVortexCenter, c.vCenter[0], c.vCenter[1]);
  gl.uniform1f(u.uVortexSpeed, c.vSpeed);
  gl.uniform1f(u.uVortexDecay, c.vDecay);
  gl.uniform1f(u.uSplitMode, c.splitOn);
  gl.uniform1f(u.uSplitSpeed, c.splitSpeed);
  gl.uniform1f(u.uRelax, 6.0);
  gl.uniform1f(u.uDt, dt);
  /* xhigh 第5轮: 尾流保护 — 障碍物左缘 uv.x (圆: x - r/ar), 下游只保留 3% relax */
  let obsLeft = 0.0;
  for (let i = 0; i < obstacles.length; i++) {
    const ob = obstacles[i];
    const ar = obstacleFBO ? obstacleFBO.width / obstacleFBO.height : 1.0;
    const left = ob.x - (ob.shape === 'circle' ? ob.r / ar : ob.r * Math.max(1, Math.abs(Math.cos(ob.rot))) );
    if (left > obsLeft) obsLeft = left;
  }
  gl.uniform1f(u.uObsLeft, obsLeft);
  /* 尾流保护只在横流模式 (street) 开启; 竖直流 (rain) 用 x 向保护区会破坏下落 */
  gl.uniform1f(u.uWakeKeep, mode === 'street' ? 0.03 : 1.0);
  gl.uniform1f(u.uVOff, Q.vOff); gl.uniform1f(u.uVSpan, Q.vSpan); gl.uniform1f(u.uVMax, Q.vMax);
  gl.uniform1i(u.uObstacle, obstacleFBO.attach(1));
  gl.uniform1i(u.uVelocity, velocity.read.attach(0));
  blit(velocity.write); velocity.swap();
}

function step(dt) {
  gl.disable(gl.BLEND);
  const tx = velocity.texelSizeX, ty = velocity.texelSizeY;
  const u = (p) => p.uniforms;

  /* 1. 指针搅动 + 演示注入 + 统一风场 */
  for (let i = 0; i < pointerQueue.length; i++) {
    const p = pointerQueue[i];
    splat(p.x, p.y, p.dx, p.dy, p.cr, p.cg, p.cb, p.rad);
  }
  pointerQueue.length = 0;
  AutoDirector.update(dt, performance.now());
  updateWind(dt);
  applyWindPass(dt);

  /* 2. curl */
  curlP.bind();
  gl.uniform2f(u(curlP).texelSize, tx, ty);
  gl.uniform1f(u(curlP).uVOff, Q.vOff); gl.uniform1f(u(curlP).uVSpan, Q.vSpan);
  gl.uniform1f(u(curlP).uCOff, Q.cOff); gl.uniform1f(u(curlP).uCScale, Q.cScale); gl.uniform1f(u(curlP).uCMax, Q.cMax);
  gl.uniform1i(u(curlP).uObstacle, obstacleFBO.attach(1));
  gl.uniform1i(u(curlP).uVelocity, velocity.read.attach(0));
  blit(curl);

  /* 3. vorticity confinement */
  if (config.CURL > 0) {
    vortP.bind();
    gl.uniform2f(u(vortP).texelSize, tx, ty);
    /* 涡量约束: 与 v3 标定一致 (8bit 不降档 — v3 在此环境 39FPS 清晰涡街) */
    gl.uniform1f(u(vortP).uStrength, config.CURL * vortMul());
    gl.uniform1f(u(vortP).uVOff, Q.vOff); gl.uniform1f(u(vortP).uVSpan, Q.vSpan); gl.uniform1f(u(vortP).uVMax, Q.vMax);
    gl.uniform1f(u(vortP).uCOff, Q.cOff); gl.uniform1f(u(vortP).uCScale, Q.cScale);
    gl.uniform1f(u(vortP).dt, dt);
    gl.uniform1i(u(vortP).uObstacle, obstacleFBO.attach(2));
    gl.uniform1i(u(vortP).uCurl, curl.attach(1));
    gl.uniform1i(u(vortP).uVelocity, velocity.read.attach(0));
    blit(velocity.write); velocity.swap();
  }

  /* 4. SDF 投影 (pre) */
  if (obstacles.length > 0) {
    sdfProjP.bind();
    gl.uniform2f(u(sdfProjP).texelSize, tx, ty);
    gl.uniform1f(u(sdfProjP).uVOff, Q.vOff); gl.uniform1f(u(sdfProjP).uVSpan, Q.vSpan); gl.uniform1f(u(sdfProjP).uVMax, Q.vMax);
    gl.uniform1i(u(sdfProjP).uObstacle, obstacleFBO.attach(1));
    gl.uniform1i(u(sdfProjP).uVelocity, velocity.read.attach(0));
    blit(velocity.write); velocity.swap();
  }

  /* 5. advect velocity */
  advectP.bind();
  gl.uniform2f(u(advectP).fVelTexel, tx, ty);
  gl.uniform2f(u(advectP).fDyeTexelSize, tx, ty);
  gl.uniform1f(u(advectP).dt, dt);
  gl.uniform1f(u(advectP).dissipation, config.VELOCITY_DISSIPATION);
  gl.uniform1f(u(advectP).uField, 0.0);
  gl.uniform1f(u(advectP).uVOff, Q.vOff); gl.uniform1f(u(advectP).uVSpan, Q.vSpan); gl.uniform1f(u(advectP).uVMax, Q.vMax);
  gl.uniform1f(u(advectP).uDyeClamp, Q.dyeClamp);
  gl.uniform1i(u(advectP).uObstacle, obstacleFBO.attach(2));
  const velId = velocity.read.attach(0);
  gl.uniform1i(u(advectP).uVelocity, velId);
  gl.uniform1i(u(advectP).uSource, velId);
  blit(velocity.write); velocity.swap();

  /* 6. divergence */
  divergeP.bind();
  gl.uniform2f(u(divergeP).texelSize, tx, ty);
  gl.uniform1f(u(divergeP).uVOff, Q.vOff); gl.uniform1f(u(divergeP).uVSpan, Q.vSpan);
  gl.uniform1f(u(divergeP).uDOff, Q.dOff); gl.uniform1f(u(divergeP).uDScale, Q.dScale); gl.uniform1f(u(divergeP).uDMax, Q.dMax);
  gl.uniform1i(u(divergeP).uObstacle, obstacleFBO.attach(1));
  gl.uniform1i(u(divergeP).uVelocity, velocity.read.attach(0));
  blit(divergence);

  /* 7. clear pressure */
  clearP.bind();
  gl.uniform1f(u(clearP).uValue, config.PRESSURE);
  gl.uniform1f(u(clearP).uOff, Q.pOff);
  gl.uniform1i(u(clearP).uTexture, pressure.read.attach(0));
  blit(pressure.write); pressure.swap();

  /* 8. Jacobi */
  pressureP.bind();
  gl.uniform2f(u(pressureP).texelSize, tx, ty);
  gl.uniform1f(u(pressureP).uPOff, Q.pOff); gl.uniform1f(u(pressureP).uPScale, Q.pScale); gl.uniform1f(u(pressureP).uPMax, Q.pMax);
  gl.uniform1f(u(pressureP).uDOff, Q.dOff); gl.uniform1f(u(pressureP).uDScale, Q.dScale);
  gl.uniform1i(u(pressureP).uDivergence, divergence.attach(1));
  gl.uniform1i(u(pressureP).uObstacle, obstacleFBO.attach(2));
  for (let i = 0; i < config.PRESSURE_ITERATIONS; i++) {
    gl.uniform1i(u(pressureP).uPressure, pressure.read.attach(0));
    blit(pressure.write); pressure.swap();
  }

  /* 9. gradient subtract */
  gradientP.bind();
  gl.uniform2f(u(gradientP).texelSize, tx, ty);
  gl.uniform1f(u(gradientP).uPOff, Q.pOff); gl.uniform1f(u(gradientP).uPScale, Q.pScale);
  gl.uniform1f(u(gradientP).uVOff, Q.vOff); gl.uniform1f(u(gradientP).uVSpan, Q.vSpan); gl.uniform1f(u(gradientP).uVMax, Q.vMax);
  gl.uniform1i(u(gradientP).uObstacle, obstacleFBO.attach(2));
  gl.uniform1i(u(gradientP).uPressure, pressure.read.attach(0));
  gl.uniform1i(u(gradientP).uVelocity, velocity.read.attach(1));
  blit(velocity.write); velocity.swap();

  /* 10. SDF 投影 (post) */
  if (obstacles.length > 0) {
    sdfProjP.bind();
    gl.uniform2f(u(sdfProjP).texelSize, tx, ty);
    gl.uniform1f(u(sdfProjP).uVOff, Q.vOff); gl.uniform1f(u(sdfProjP).uVSpan, Q.vSpan); gl.uniform1f(u(sdfProjP).uVMax, Q.vMax);
    gl.uniform1i(u(sdfProjP).uObstacle, obstacleFBO.attach(1));
    gl.uniform1i(u(sdfProjP).uVelocity, velocity.read.attach(0));
    blit(velocity.write); velocity.swap();
  }

  /* 11. advect dye */
  advectP.bind();
  gl.uniform2f(u(advectP).fVelTexel, tx, ty);
  gl.uniform2f(u(advectP).fDyeTexelSize, dye.texelSizeX, dye.texelSizeY);
  gl.uniform1f(u(advectP).dt, dt);
  gl.uniform1f(u(advectP).dissipation, config.DENSITY_DISSIPATION);
  gl.uniform1f(u(advectP).uField, 1.0);
  gl.uniform1f(u(advectP).uVOff, Q.vOff); gl.uniform1f(u(advectP).uVSpan, Q.vSpan); gl.uniform1f(u(advectP).uVMax, Q.vMax);
  gl.uniform1f(u(advectP).uDyeClamp, Q.dyeClamp);
  gl.uniform1i(u(advectP).uObstacle, obstacleFBO.attach(2));
  gl.uniform1i(u(advectP).uVelocity, velocity.read.attach(0));
  gl.uniform1i(u(advectP).uSource, dye.read.attach(1));
  blit(dye.write); dye.swap();
}

/* ======================================================================
   显示 (4 模式 + bloom + 皮肤 palette)
====================================================================== */
let streakDensity = 1.0;   // 性能降级: 1.0 → 1.4 → 1.9
let smokeOn = true;

function applyBloom2Level() {
  const src = dye.read;
  gl.disable(gl.BLEND);
  bloomPreP.bind();
  const p = bloomPreP.uniforms;
  const knee = config.BLOOM_THRESHOLD * config.BLOOM_SOFT_KNEE + 0.0001;
  gl.uniform3f(p.uCurve, config.BLOOM_THRESHOLD - knee, knee * 2.0, 0.25 / knee);
  gl.uniform1f(p.uThreshold, config.BLOOM_THRESHOLD);
  gl.uniform1i(p.uTexture, src.attach(0));
  blit(bloomA);
  blurP.bind();
  const b = blurP.uniforms;
  gl.uniform1i(b.uTexture, bloomA.attach(0));
  gl.uniform2f(b.texelSize, 1.0 / bloomA.width, 0.0);
  blit(bloomB);
  gl.uniform1i(b.uTexture, bloomB.attach(0));
  gl.uniform2f(b.texelSize, 0.0, 1.0 / bloomA.height);
  blit(bloomA);
  gl.uniform1i(b.uTexture, bloomA.attach(0));
  gl.uniform2f(b.texelSize, 2.0 / bloomA.width, 0.0);
  blit(bloomB);
  gl.uniform1i(b.uTexture, bloomB.attach(0));
  gl.uniform2f(b.texelSize, 0.0, 2.0 / bloomA.height);
  blit(bloomA);
}

function setViewCommon(prog, dw, dh) {
  const u = prog.uniforms;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  gl.uniform2f(u.uResolution, dw, dh);
  gl.uniform2f(u.uVelToPx, dw / velocity.width, dh / velocity.height);
  gl.uniform1f(u.uVelOff, Q.vOff);
  gl.uniform1f(u.uVelSpan, Q.vSpan);
  gl.uniform1f(u.uCurlOff, Q.cOff);
  gl.uniform1f(u.uCurlScale, Q.cScale);
  gl.uniform1f(u.uVelVisScale, isMobile ? 10.0 : 12.0);
  const sp = skinPalette;
  gl.uniform3f(u.uObstacleA, sp.obsA[0], sp.obsA[1], sp.obsA[2]);
  gl.uniform3f(u.uObstacleB, sp.obsB[0], sp.obsB[1], sp.obsB[2]);
  gl.uniform3f(u.uObstacleEdge, sp.obsEdge[0], sp.obsEdge[1], sp.obsEdge[2]);
  gl.uniform1f(u.uBloomStr, config.BLOOM_INTENSITY * 0.5);
  gl.uniform1i(u.uVelocity, velocity.read.attach(0));
  gl.uniform1i(u.uObstacle, obstacleFBO.attach(1));
  gl.uniform1i(u.uCurl, curl.attach(2));
  gl.uniform1i(u.uDye, dye.read.attach(3));
  gl.uniform1i(u.uBloom, bloomA.attach(4));
}

function particleUpdateStep(dt, nowSec) {
  /* update: particleA → particleB */
  particleUpdateP.bind();
  const u = particleUpdateP.uniforms;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = particleB.width, h = particleB.height; /* 目标 FBO 尺寸, 不是画布 */
  gl.uniform2f(u.uVelToPx, w / velocity.width, h / velocity.height);
  gl.uniform1f(u.uVelOff, Q.vOff); gl.uniform1f(u.uVelSpan, Q.vSpan);
  gl.uniform1f(u.uCurlOff, Q.cOff); gl.uniform1f(u.uCurlScale, Q.cScale);
  gl.uniform2f(u.uSimSize, velocity.width, velocity.height);
  gl.uniform1f(u.uDt, dt);
  gl.uniform1f(u.uDecay, Math.exp(-dt / 0.22));
  gl.uniform1f(u.uSpawnRate, isMobile ? 0.022 : 0.028);
  gl.uniform1f(u.uSpawnFreq, 24.0);
  gl.uniform1f(u.uPointRadius, 0.36);
  gl.uniform2f(u.uSpawnGrid, particleGridX, particleGridY);
  gl.uniform1f(u.uInjectGain, 0.65);
  const sp = skinPalette;
  gl.uniform3f(u.uParticleColor, sp.pColor[0], sp.pColor[1], sp.pColor[2]);
  gl.uniform1f(u.uTime, nowSec);
  gl.uniform1i(u.uVelocity, velocity.read.attach(0));
  gl.uniform1i(u.uObstacle, obstacleFBO.attach(1));
  gl.uniform1i(u.uPrev, particleA.attach(2));
  blit(particleB);
  const t = particleA; particleA = particleB; particleB = t;
}

function render(nowSec) {
  if (config.BLOOM) applyBloom2Level();
  const dw = displayFBO.width, dh = displayFBO.height;
  const dt = 1 / 60;
  /* view pass 画到 displayFBO (软渲染 0.65×), 结尾统一放大到画布 */

  if (state.view === 'particle') {
    particleUpdateStep(1/60, nowSec);
    const prog = particleRenderP;
    prog.bind();
    setViewCommon(prog, dw, dh);
    const u = prog.uniforms;
    const sp = skinPalette;
    gl.uniform3f(u.uParticleBg, sp.pBg[0], sp.pBg[1], sp.pBg[2]);
    gl.uniform1f(u.uParticleGain, 1.7);
    gl.uniform1f(u.uSubtract, currentSkin().inkInvert ? 1.0 : 0.0);
    gl.uniform1i(u.uParticles, particleA.attach(5));
    blit(displayFBO);
  } else if (state.view === 'scalar') {
    const prog = viewScalarP;
    prog.bind();
    setViewCommon(prog, dw, dh);
    const u = prog.uniforms;
    const fieldIdx = state.scalarField === 'speed' ? 0 : (state.scalarField === 'pressure' ? 1 : 2);
    gl.uniform1i(u.uScalarField, fieldIdx);
    gl.uniform1i(u.uColormap, state.colormap === 'turbo' ? 1 : 0);
    if (state.scalarField === 'speed') {
      gl.uniform1f(u.uScalarMin, 0.0);
      gl.uniform1f(u.uScalarMax, isMobile ? 10.0 : 12.0);
    } else if (state.scalarField === 'curl') {
      gl.uniform1f(u.uScalarMin, -25.0); gl.uniform1f(u.uScalarMax, 25.0);
    } else {
      gl.uniform1f(u.uScalarMin, -5.0); gl.uniform1f(u.uScalarMax, 5.0);
    }
    gl.uniform1f(u.uPressureOff, Q.pOff);
    gl.uniform1f(u.uPressureScale, Q.pScale);
    gl.uniform1i(u.uPressure, pressure.read.attach(5));
    blit(displayFBO);
  } else if (state.view === 'wake') {
    const prog = viewWakeP;
    prog.bind();
    setViewCommon(prog, dw, dh);
    const u = prog.uniforms;
    const sp = skinPalette;
    gl.uniform3f(u.uWakeBg, sp.wakeBg[0], sp.wakeBg[1], sp.wakeBg[2]);
    gl.uniform3f(u.uWakeLow, sp.wakeLow[0], sp.wakeLow[1], sp.wakeLow[2]);
    gl.uniform3f(u.uWakeMid, sp.wakeMid[0], sp.wakeMid[1], sp.wakeMid[2]);
    gl.uniform3f(u.uWakeHigh, sp.wakeHigh[0], sp.wakeHigh[1], sp.wakeHigh[2]);
    /* 尾流视图: 染料主导, 涡核 = v3 同款指数软饱和
       float: 死区0/增益6.0 (v3 标定); 8bit: 死区3.5 压掉量化噪声地板(4-tap平滑后≈2-3), 只点亮相干涡 */
    gl.uniform1f(u.uDyeGain, 2.0);
    gl.uniform1f(u.uCurlGain, 0.45);
    gl.uniform2f(u.uCoreRange, floatFields ? 0.0 : 3.5, floatFields ? 6.0 : 2.5);
    gl.uniform2f(u.uCurlFade, 18.0, 28.0);
    blit(displayFBO);
  } else {
    /* 风洞 (默认) */
    const prog = viewWindP;
    prog.bind();
    setViewCommon(prog, dw, dh);
    const u = prog.uniforms;
    const sp = skinPalette;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    gl.uniform3f(u.uWindLow, sp.windLow[0], sp.windLow[1], sp.windLow[2]);
    gl.uniform3f(u.uWindMid, sp.windMid[0], sp.windMid[1], sp.windMid[2]);
    gl.uniform3f(u.uWindHigh, sp.windHigh[0], sp.windHigh[1], sp.windHigh[2]);
    gl.uniform3f(u.uStreakLow, sp.streakLow[0], sp.streakLow[1], sp.streakLow[2]);
    gl.uniform3f(u.uStreakHigh, sp.streakHigh[0], sp.streakHigh[1], sp.streakHigh[2]);
    gl.uniform3f(u.uSmoke0, sp.smoke0[0], sp.smoke0[1], sp.smoke0[2]);
    gl.uniform3f(u.uSmoke1, sp.smoke1[0], sp.smoke1[1], sp.smoke1[2]);
    gl.uniform1f(u.uStreakSpacing, (isMobile ? 32 : 24) * dpr * streakDensity);
    gl.uniform1f(u.uStreakWidth, 1.5 * dpr);
    gl.uniform1f(u.uStreakAlpha, 0.58);
    gl.uniform1f(u.uStreakMinPx, 3.5 * dpr);
    gl.uniform1f(u.uStreakMaxPx, (isMobile ? 12 : 16) * dpr);
    gl.uniform1f(u.uWindXBias, 0.18);
    gl.uniform1f(u.uCurlLow, 2.0);
    gl.uniform1f(u.uCurlHigh, 10.0);
    /* 风洞视图: 干净速度场渐变 + 红色矢量网 (对齐参考图, 上游无染料条带)
       深蓝尾流由速度 ramp 的慢流端 (windLow) 天然产生; 染料烟雾近乎关闭避免 7 行注入的斑马条带 */
    gl.uniform1f(u.uSmokeAlpha, smokeOn ? 0.10 : 0.0);
    gl.uniform1f(u.uVignette, 0.30);
    blit(displayFBO);
  }

  /* 放大到画布 (LINEAR 采样, 1 次廉价 copy pass) */
  copyP.bind();
  gl.uniform1i(copyP.uniforms.uTexture, displayFBO.attach(0));
  blit(null);
}

/* ======================================================================
   模式切换
====================================================================== */
function setMode(m) {
  mode = m;
  document.querySelectorAll('#modeBtns .mbtn').forEach(b => b.classList.toggle('active', b.dataset.mode === m));
  obstacles = MODES[m].obstacles.map(o => ({ shape:o.shape, x:o.x, y:o.y, r:o.r, rot:o.rot }));
  maskDirty = true;
  config.CURL = MODES[m].curl;
  config.DENSITY_DISSIPATION = MODES[m].diss;
  document.getElementById('ctlVort').value = 1.0;
  document.getElementById('valVort').textContent = '1.00';
  syncSliderFill(document.getElementById('ctlVort'));
  setWindTarget(true);
  clearFields();
  AutoDirector.setMode(m, performance.now());
  AutoDirector.prime(MODES[m].prime);
  hudModeName.textContent = MODE_NAME[m] || m;
  toast(MODE_INFO[m]);
}
const MODE_NAME = { street:'涡街', fireworks:'烟花', rain:'细雨', vortex:'漩涡', jet:'对撞', free:'自由' };
document.querySelectorAll('#modeBtns .mbtn').forEach(btn => {
  btn.addEventListener('click', () => setMode(btn.dataset.mode));
});

/* ======================================================================
   HUD (2Hz 刷新)
====================================================================== */
const hudFps = document.getElementById('hudFps');
const hudGrid = document.getElementById('hudGrid');
const hudWind = document.getElementById('hudWind');
const hudModeName = document.getElementById('hudMode');
const hudSkinEl = document.getElementById('hudSkin');
const hudDye = document.getElementById('hudDye');
let hudFrames = 0, hudLastT = performance.now();

function updateHudStatic() {
  if (!velocity) return;
  hudGrid.textContent = velocity.width + '×' + velocity.height;
  hudDye.textContent = dye ? dye.width : '--';
}
function updateHudDynamic(now) {
  hudFrames++;
  const interval = now - hudLastT;
  if (interval >= 500) {
    const fps = Math.round(hudFrames * 1000 / interval);
    hudFrames = 0; hudLastT = now;
    hudFps.textContent = String(fps);
    const c = windState.cur;
    /* HUD 风速 = 滑杆设定值 (对齐参考图 "风速 2.20" 的可读性) */
    hudWind.textContent = (parseFloat(document.getElementById('ctlWind').value) || 2.0).toFixed(2);
    return fps;
  }
  return null;
}

/* colorbar (标量模式) */
const colorbar = document.getElementById('colorbar');
const colorbarBar = document.getElementById('colorbarBar');
const COLORBAR_GRADIENTS = {
  viridis: 'linear-gradient(to top, #440154 0%, #3b528b 25%, #21918c 50%, #5ec962 75%, #fde725 100%)',
  turbo: 'linear-gradient(to top, #30123b 0%, #4669b0 25%, #35b779 50%, #f5d442 75%, #8c2d04 100%)'
};
function updateColorbar() {
  if (state.view !== 'scalar') { colorbar.hidden = true; return; }
  colorbar.hidden = false;
  const mobile = window.matchMedia('(max-width: 720px)').matches;
  const dir = mobile ? 'to right' : 'to top';
  colorbarBar.style.background = (COLORBAR_GRADIENTS[state.colormap] || COLORBAR_GRADIENTS.viridis).replace('to top', dir);
  let m = -16, M = 16;
  if (state.scalarField === 'speed') { m = 0; M = isMobile ? 10 : 12; }
  else if (state.scalarField === 'curl') { m = -25; M = 25; }
  document.getElementById('colorbarMin').textContent = m.toFixed(1);
  document.getElementById('colorbarMax').textContent = M.toFixed(1);
}

/* ======================================================================
   UI 绑定: 显示模式 chips / 皮肤按钮 / 参数
====================================================================== */
function syncSliderFill(el) {
  const min = parseFloat(el.min || '0'), max = parseFloat(el.max || '100'), v = parseFloat(el.value || '0');
  el.style.setProperty('--fill', ((v - min) / (max - min) * 100) + '%');
}

function setView(v) {
  state.view = v;
  document.querySelectorAll('#viewChips .chip').forEach(b => b.classList.toggle('active', b.dataset.view === v));
  hudModeName.textContent = { wind:'风洞', wake:'尾流', scalar:'色图', particle:'粒子' }[v];
  const isScalar = (v === 'scalar');
  document.getElementById('ctlScalarWrap').hidden = !isScalar;
  document.getElementById('ctlCmapWrap').hidden = !isScalar;
  updateColorbar();
}
document.querySelectorAll('#viewChips .chip').forEach(btn => {
  btn.addEventListener('click', () => setView(btn.dataset.view));
});

function setSkin(id) {
  state.skin = id;
  document.querySelectorAll('.skin-btn').forEach(b => b.classList.toggle('active', b.dataset.skin === id));
  applySkinPalette();
  hudSkinEl.textContent = currentSkin().name;
}
function buildSkinButtons() {
  const box = document.getElementById('skinBtns');
  box.innerHTML = '';
  Object.keys(SKINS).forEach(id => {
    const s = SKINS[id];
    const b = document.createElement('button');
    b.className = 'skin-btn' + (id === state.skin ? ' active' : '');
    b.dataset.skin = id;
    b.title = s.name;
    const iEl = document.createElement('i');
    iEl.style.background = s.preview;
    b.appendChild(iEl);
    const tip = document.createElement('span');
    tip.className = 'tip';
    tip.textContent = s.name;
    b.appendChild(tip);
    b.addEventListener('click', () => setSkin(id));
    box.appendChild(b);
  });
}
buildSkinButtons();

/* 参数滑杆 */
function bindRange(id, valId, fn, fmt) {
  const el = document.getElementById(id), v = document.getElementById(valId);
  const upd = () => { const x = parseFloat(el.value); if (v) v.textContent = fmt ? fmt(x) : x; syncSliderFill(el); fn(x); };
  el.addEventListener('input', upd);
  upd();
}
bindRange('ctlWind', 'valWind', () => {}, x => x.toFixed(2));
bindRange('ctlVort', 'valVort', () => {}, x => x.toFixed(2));

document.getElementById('ctlScalar').addEventListener('change', e => { state.scalarField = e.target.value; updateColorbar(); });
document.getElementById('ctlCmap').addEventListener('change', e => { state.colormap = e.target.value; updateColorbar(); });

/* 暂停 / 重置 */
const pauseBtn = document.getElementById('pauseBtn');
pauseBtn.addEventListener('click', () => {
  config.PAUSED = !config.PAUSED;
  pauseBtn.textContent = config.PAUSED ? '▶' : '⏸';
  pauseBtn.classList.toggle('active', config.PAUSED);
});
document.getElementById('resetBtn').addEventListener('click', () => { clearFields(); toast('已清除染料与速度场'); });
document.getElementById('defaultBtn').addEventListener('click', () => {
  setSkin('engineering'); setView('wind'); setMode('street');
  document.getElementById('ctlWind').value = 2.0;
  document.getElementById('valWind').textContent = '2.00';
  syncSliderFill(document.getElementById('ctlWind'));
  toast('已恢复默认：风洞 · 工程风 · 涡街');
});
document.getElementById('shareBtn').addEventListener('click', () => {
  const s = { m: mode, v: state.view, k: state.skin };
  try {
    const url = location.origin + location.pathname + '?' + JSON.stringify(s);
    if (navigator.clipboard) { navigator.clipboard.writeText(url).then(() => toast('分享链接已复制到剪贴板'), () => toast(url)); }
    else toast(url);
  } catch (e) { toast('复制失败'); }
});

/* ======================================================================
   指针交互: 拖动搅动 / 长按增删障碍 / 双击增删 / 滚轮缩放 / 点击爆发
====================================================================== */
function toUV(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width, y: 1 - (e.clientY - r.top) / r.height };
}
let drag = null;
let lpTimer = null, lpPt = null, lpMoved = false;
let lastUserT = performance.now(), lastAutoT = 0;

function pointerSplat(x, y, dx, dy, speed) {
  /* speed: uv/s → 表值力 (clamp 3.5) → 格/秒 */
  const forcePeak = clamp(speed * 14, 0, 3.5);
  if (forcePeak < 0.01 && dx === 0 && dy === 0) return;
  const dist = Math.hypot(dx, dy);
  const dirX = dist > 0 ? dx / dist : 0, dirY = dist > 0 ? dy / dist : 1;
  const f = 7.0 * simScale();
  const fx = (dx !== 0 || dy !== 0) ? dirX * forcePeak * f : 0;
  const fy = (dx !== 0 || dy !== 0) ? dirY * forcePeak * f : 0;
  const seed = 0.1 + Math.random() * 0.8;
  const dyeAmt = 0.5 + clamp(speed * 0.05, 0, 0.5);
  const rad = 0.008 * (1 + clamp(speed * 0.04, 0, 0.6));
  pointerQueue.push({ x, y, dx: fx, dy: fy, cr: dyeAmt, cg: 0, cb: seed, rad });
}

canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  lastUserT = performance.now();
  const uv = toUV(e);
  const idx = hitObstacle(uv.x, uv.y);
  if (idx >= 0) { drag = { type:'ob', i: idx }; canvas.classList.add('grabbing'); }
  else drag = { type:'stir', last: uv, lastT: performance.now() };
  try { canvas.setPointerCapture(e.pointerId); } catch(err){}
  lpPt = { x: e.clientX, y: e.clientY }; lpMoved = false;
  clearTimeout(lpTimer);
  lpTimer = setTimeout(() => {
    if (lpMoved || !lpPt) return;
    const p = lpPt; lpPt = null;
    const uv2 = toUV(p);
    const i2 = hitObstacle(uv2.x, uv2.y);
    if (i2 >= 0) { removeObstacle(i2); toast('已删除障碍物（长按）'); }
    else { addObstacle('circle', uv2.x, uv2.y, nextSize); toast('已添加圆形障碍（长按）'); }
    drag = null;
  }, 550);
});
canvas.addEventListener('pointermove', (e) => {
  if (lpPt) {
    const mdx = e.clientX - lpPt.x, mdy = e.clientY - lpPt.y;
    if (mdx*mdx + mdy*mdy > 144) { lpMoved = true; clearTimeout(lpTimer); lpPt = null; }
  }
  const uv = toUV(e);
  if (!drag) {
    canvas.classList.toggle('grab', hitObstacle(uv.x, uv.y) >= 0);
    return;
  }
  lastUserT = performance.now();
  if (drag.type === 'ob') {
    const ob = obstacles[drag.i];
    if (!ob) { drag = null; return; }
    if (e.shiftKey && ob.shape === 'box') ob.rot = Math.atan2(uv.y - ob.y, uv.x - ob.x);
    else { ob.x = clamp(uv.x, 0.02, 0.98); ob.y = clamp(uv.y, 0.02, 0.98); }
    maskDirty = true;
  } else {
    const now = performance.now();
    const dt = Math.max(1/240, (now - drag.lastT) / 1000);
    const dx = uv.x - drag.last.x, dy = uv.y - drag.last.y;
    drag.last = uv; drag.lastT = now;
    pointerSplat(uv.x, uv.y, dx, dy, Math.hypot(dx, dy) / dt);
  }
});
window.addEventListener('pointerup', () => { drag = null; canvas.classList.remove('grabbing'); clearTimeout(lpTimer); lpPt = null; });
canvas.addEventListener('dblclick', (e) => {
  const uv = toUV(e);
  const idx = hitObstacle(uv.x, uv.y);
  if (idx >= 0) { removeObstacle(idx); toast('已删除障碍物'); }
  else {
    /* 点击爆发: 8 向喷射 + 中心注染 */
    const f = 7.0 * simScale() * 0.85;
    const seed = 0.1 + Math.random() * 0.8;
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      splat(uv.x + Math.cos(a) * 0.010, uv.y + Math.sin(a) * 0.010, Math.cos(a) * f, Math.sin(a) * f, 0.65, 0, seed, 0.012);
    }
    splat(uv.x, uv.y, 0, 0, 0.85, 0, seed, 0.006);
    toast('💥 点击爆发！双击空白处也可添加障碍物');
  }
});
canvas.addEventListener('contextmenu', (e) => {
  e.preventDefault();
  const uv = toUV(e);
  const idx = hitObstacle(uv.x, uv.y);
  if (idx >= 0) removeObstacle(idx);
});
canvas.addEventListener('wheel', (e) => {
  const uv = toUV(e);
  const idx = hitObstacle(uv.x, uv.y);
  if (idx >= 0) {
    e.preventDefault();
    const ob = obstacles[idx];
    ob.r = clamp(ob.r * (e.deltaY > 0 ? 0.93 : 1.07), 0.02, 0.22);
    maskDirty = true;
  }
}, { passive:false });

let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3200);
}

/* ======================================================================
   主循环 + 自适应降质
====================================================================== */
let last = performance.now();
const startTime = last;
let fps = 60, frames = 0, lastFpsT = performance.now();
let qChecks = 0, lastDowngradeT = 0;
let lastFpsValue = null;

function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000;
  last = now;
  dt = clamp(dt, 0.001, 0.0166);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(2, Math.floor(canvas.clientWidth * dpr));
  const h = Math.max(2, Math.floor(canvas.clientHeight * dpr));
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w; canvas.height = h;
    initFramebuffers();
  }
  if (maskDirty) { paintObstacleMask(); maskDirty = false; }
  if (!config.PAUSED) {
    /* 空闲 4.5s 后自动搅动 (free 模式才有演示注入, 其他模式靠 AutoDirector) */
    if (mode === 'free' && now - lastUserT > 4500) lastUserT = now;
    step(dt);
  }
  render(now * 0.001);
  const fpsNow = updateHudDynamic(now);
  if (fpsNow != null) {
    fps = fpsNow;
    qChecks++;
    if (qChecks >= 4) {
      qChecks = 0;
      const warmup = now - startTime < 15000;   // 启动 15s 内不降质 (shader 编译/预热期)
      /* 降质阶梯: 染料分辨率 → 速度网格 → 显示模式降级 (每 6s 最多一级; 阈值 30 = 软渲染合格线) */
      if (!warmup && fps < 30 && now - lastDowngradeT > 6000) {
        lastDowngradeT = now;
        if (dyeResScale > 0.5) {
          dyeResScale -= 0.25;
          initFramebuffers();
          toast('性能保护：已降低渲染分辨率');
        } else if (config.SIM_RESOLUTION > 96) {
          config.SIM_RESOLUTION = Math.max(96, Math.round(config.SIM_RESOLUTION * 0.75 / 8) * 8);
          initFramebuffers();
          toast('性能保护：已降低物理网格分辨率');
        } else if (state.view === 'particle') {
          setView('wake');
          toast('性能保护：已切到尾流模式');
        } else if (state.view === 'wind' && smokeOn) {
          smokeOn = false;
          toast('性能保护：已关闭尾流烟雾层');
        } else if (streakDensity < 2.5) {
          streakDensity += 0.5;
        }
      }
      /* 自动恢复: 稳定 50+ FPS 持续 20s → 逐级升档回默认 */
      else if (fps > 50 && now - lastDowngradeT > 20000) {
        if (!smokeOn) {
          smokeOn = true;
          toast('性能已恢复：尾流烟雾层已开启');
        } else if (config.SIM_RESOLUTION < SIM_RES_DEFAULT) {
          config.SIM_RESOLUTION = Math.min(SIM_RES_DEFAULT, config.SIM_RESOLUTION + 16);
          initFramebuffers();
          toast('性能已恢复：物理网格已提升');
        } else if (dyeResScale < 1.0) {
          dyeResScale = Math.min(1.0, dyeResScale + 0.25);
          initFramebuffers();
          toast('性能已恢复：渲染分辨率已提升');
        }
      }
    }
  }
}

/* ======================================================================
   启动
====================================================================== */
function readShareParams() {
  try {
    const qs = new URLSearchParams(location.search);
    if (qs.has('s')) {
      const s = JSON.parse(qs.get('s'));
      if (s.m && MODES[s.m]) mode = s.m;
      if (s.v && { wind:1, wake:1, scalar:1, particle:1 }[s.v]) state.view = s.v;
      if (s.k && SKINS[s.k]) state.skin = s.k;
    }
  } catch (e) {}
}

readShareParams();
initFramebuffers();
applySkinPalette();
setView(state.view);
buildSkinButtons();
setMode(mode);
updateColorbar();
requestAnimationFrame(frame);

</script>
