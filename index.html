<script>
'use strict';
/* =====================================================================
 * 流体实验室 v3 — 仿制 PavelDoGreat "WebGL Fluid Simulation" (MIT) 架构
 *  - 半拉格朗日平流 + Jacobi 压力投影 + 涡量约束 (标准 Stam stable-fluids)
 *  - 染料/速度分离高分辨率场, 双 FBO ping-pong, blit 全视口四边形
 *  - 障碍物: SDF mask (r=0 固体 / 1 流体, g=归一化 SDF), no-flux 散度边界
 *    + 压力 Dirichlet + SDF 法向投影 (no-penetration)
 *  - 显示: SHADING 伪光照 + 2 级半分辨率高斯 Bloom + 涡量辉光 + ACES
 *    + 饱和度 + 暗角 + 代码生成蓝噪声 dithering
 *  - 运行时 RGBA16F 探测 (completeness + clear/readPixels 往返),
 *    失败回退 RGBA8 scale/offset 量化 (float 路径为恒等, 数值=标准 Stam)
 *  - Mesa llvmpipe 兼容: vertex/fragment 不共用 uniform 名
 * ===================================================================== */

/* ---------------- 错误捕获 ---------------- */
function showErr(m){
  try {
    document.title = 'ERR: ' + m;
    let d = document.getElementById('dbgerr');
    if (!d) {
      d = document.createElement('div');
      d.id = 'dbgerr';
      d.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:999;background:#a00;color:#fff;font:12px monospace;padding:8px;white-space:pre-wrap;';
      document.body.appendChild(d);
    }
    d.textContent += m + '\n';
  } catch(e){}
  console.error(m);
}
window.onerror = function(m, s, l){ showErr(m + ' @' + l); };

function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
function hsv(h, s, v){
  let r, g, b, i = Math.floor(h * 6), f = h * 6 - i;
  const p = v * (1 - s), q = v * (1 - f * s), t = v * (1 - (1 - f) * s);
  switch (i % 6) {
    case 0: r=v; g=t; b=p; break;
    case 1: r=q; g=v; b=p; break;
    case 2: r=p; g=v; b=t; break;
    case 3: r=p; g=q; b=v; break;
    case 4: r=t; g=p; b=v; break;
    case 5: r=v; g=p; b=q; break;
  }
  return [r, g, b];
}

/* ---------------- WebGL context + 浮点 FBO 探测 ---------------- */
function probeFloatFBO(gl, isWebGL2, halfFloatType) {
  let ok = false;
  try {
    const W = 4, H = 4;
    const internalFormat = isWebGL2 ? gl.RGBA16F : gl.RGBA;
    const type = isWebGL2 ? gl.HALF_FLOAT : halfFloatType;
    if (!isWebGL2 && !type) return { supportsFloat: false };
    if (isWebGL2) {
      gl.getExtension('EXT_color_buffer_half_float');
      gl.getExtension('OES_texture_float_linear');
    } else {
      gl.getExtension('OES_texture_half_float');
      if (!gl.getExtension('EXT_color_buffer_half_float')) return { supportsFloat: false };
      gl.getExtension('OES_texture_half_float_linear');
    }
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D, 0, internalFormat, W, H, 0, gl.RGBA, type, null);
    if (gl.getError() !== gl.NO_ERROR) return { supportsFloat: false };
    const fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    const complete = (gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE);
    let roundtrip = false;
    if (complete) {
      gl.clearColor(1.0, 0.0, 0.0, 1.0);
      gl.clear(gl.COLOR_BUFFER_BIT);
      const px = new Uint8Array(W * H * 4);
      gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, px);
      let good = true;
      for (let i = 0; i < W * H; i++) {
        if (px[i*4] < 250 || px[i*4+1] > 10 || px[i*4+2] > 10) { good = false; break; }
      }
      roundtrip = good;
    }
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.deleteFramebuffer(fbo);
    gl.deleteTexture(tex);
    ok = complete && roundtrip;
  } catch (e) { ok = false; }
  return { supportsFloat: ok };
}

const canvas = document.getElementById('c');
function getWebGLContext(cv) {
  const params = { alpha:false, depth:false, stencil:false, antialias:false,
                   preserveDrawingBuffer:false, powerPreference:'high-performance' };
  let gl = cv.getContext('webgl2', params);
  let isWebGL2 = !!gl;
  if (!gl) {
    gl = cv.getContext('webgl', params) || cv.getContext('experimental-webgl', params);
    isWebGL2 = false;
  }
  if (!gl) return { gl:null, isWebGL2:false, ext:null };
  const ext = { isWebGL2, halfFloatType:null, floatFields:false, texType:null,
                formatRGBA:null, formatRG:null, formatR:null, supportLinearFiltering:true };
  if (isWebGL2) {
    ext.halfFloatType = gl.HALF_FLOAT;
    gl.getExtension('EXT_color_buffer_half_float');
    gl.getExtension('OES_texture_float_linear');
  } else {
    const hf = gl.getExtension('OES_texture_half_float');
    const lin = gl.getExtension('OES_texture_half_float_linear') || gl.getExtension('OES_texture_float_linear');
    ext.halfFloatType = hf ? hf.HALF_FLOAT_OES : null;
    ext.supportLinearFiltering = !!lin;
  }
  ext.floatFields = probeFloatFBO(gl, isWebGL2, ext.halfFloatType).supportsFloat;
  if (ext.floatFields) {
    ext.texType = ext.halfFloatType;
    if (isWebGL2) {
      ext.formatRGBA = { internalFormat: gl.RGBA16F, format: gl.RGBA };
      ext.formatRG   = { internalFormat: gl.RG16F,  format: gl.RG };
      ext.formatR    = { internalFormat: gl.R16F,   format: gl.RED };
    } else {
      ext.formatRGBA = { internalFormat: gl.RGBA, format: gl.RGBA };
      ext.formatRG   = { internalFormat: gl.RGBA, format: gl.RGBA };
      ext.formatR    = { internalFormat: gl.RGBA, format: gl.RGBA };
    }
  } else {
    ext.texType = gl.UNSIGNED_BYTE;
    const rgba8 = isWebGL2 ? gl.RGBA8 : gl.RGBA;
    ext.formatRGBA = { internalFormat: rgba8, format: gl.RGBA };
    ext.formatRG   = { internalFormat: rgba8, format: gl.RGBA };
    ext.formatR    = { internalFormat: rgba8, format: gl.RGBA };
    ext.supportLinearFiltering = true;
  }
  cv.addEventListener('webglcontextlost', (e) => {
    e.preventDefault();
    document.getElementById('fallback').classList.add('show');
  });
  return { gl, isWebGL2, ext };
}

const context = getWebGLContext(canvas);
if (!context.gl) {
  document.getElementById('fallback').classList.add('show');
  throw new Error('WebGL not supported');
}
const gl = context.gl;
const isWebGL2 = context.isWebGL2;
const ext = context.ext;
const floatFields = ext.floatFields;
const rgba8Internal = isWebGL2 ? gl.RGBA8 : gl.RGBA;

/* 量化约定 (float 路径全部为恒等 → 数值精确等于标准 Stam):
   velocity : stored = vOff + v / vSpan          (float 0/1 ; 8bit 0.5/64 → v∈[-32,32])
   diverge  : stored = dOff + div * dScale       (float 0/1 ; 8bit 0.5/0.1 → div∈[-5,5])
   pressure : stored = pOff + p * pScale         (float 0/1 ; 8bit 0.5/0.1 → p∈[-5,5])
   curl     : stored = cOff + curl * cScale      (float 0/1 ; 8bit 0.5/0.02 → curl∈[-25,25])
   dye      : 直接 0..1 (8bit clamp) / 线性可 >1 (float, 利于 bloom) */
const Q = {
  vOff:  floatFields ? 0.0 : 0.5,
  vSpan: floatFields ? 1.0 : 64.0,
  vMax:  floatFields ? 1000.0 : 32.0,
  dOff:  floatFields ? 0.0 : 0.5,
  dScale:floatFields ? 1.0 : 0.1,
  dMax:  floatFields ? 1e9 : 5.0,
  pOff:  floatFields ? 0.0 : 0.5,
  pScale:floatFields ? 1.0 : 0.1,
  pMax:  floatFields ? 1e9 : 5.0,
  cOff:  floatFields ? 0.0 : 0.5,
  cScale:floatFields ? 1.0 : 0.02,
  cMax:  floatFields ? 1e9 : 25.0,
  dyeScale: floatFields ? 1.0 : 0.5,
  dyeClamp: floatFields ? 0.0 : 1.0
};

/* ---------------- config ---------------- */
const isMobile = matchMedia('(max-width: 700px), (pointer: coarse)').matches;
let dyeRes = isMobile ? 512 : 1024;
const config = {
  SIM_RESOLUTION: isMobile ? 128 : 192,
  DENSITY_DISSIPATION: 0.30,
  VELOCITY_DISSIPATION: 0.20,
  PRESSURE: 0.7,
  PRESSURE_ITERATIONS: 20,
  CURL: 30,
  SPLAT_FORCE: floatFields ? 6000 : 1500,
  PAUSED: false,
  BLOOM: true,
  BLOOM_RESOLUTION: isMobile ? 192 : 256,
  BLOOM_INTENSITY: 0.85,
  BLOOM_THRESHOLD: 0.60,
  BLOOM_SOFT_KNEE: 0.70,
  displayMode: 2,
  glow: 1.05,
  wind: 40
};

/* ---------------- 状态 ---------------- */
let pointers = [];
let pointerQueue = [];
let splatStack = [];
let obstacles = [];
let maskDirty = true;
let mode = 'vortex';
let hueBase = Math.random();
let nextSize = 0.06;

/* ---------------- shaders (GLSL 300 es) ----------------
 * 命名约定: vertex 侧统一 texelSize; fragment 侧一律 fTexelSize /
 * fDyeTexelSize / uDyeTexel, 杜绝 Mesa 同名 uniform 链接失败。 */
const VERT_BASE = `#version 300 es
precision highp float;
layout(location = 0) in vec2 aPosition;
out vec2 vUv;
out vec2 vL;
out vec2 vR;
out vec2 vT;
out vec2 vB;
uniform vec2 texelSize;
void main() {
  vUv = aPosition * 0.5 + 0.5;
  vL = vUv - vec2(texelSize.x, 0.0);
  vR = vUv + vec2(texelSize.x, 0.0);
  vT = vUv + vec2(0.0, texelSize.y);
  vB = vUv - vec2(0.0, texelSize.y);
  gl_Position = vec4(aPosition, 0.0, 1.0);
}`;

const VERT_BLUR = `#version 300 es
precision highp float;
layout(location = 0) in vec2 aPosition;
out vec2 vUv;
out vec2 vL;
out vec2 vR;
uniform vec2 texelSize;
void main() {
  vUv = aPosition * 0.5 + 0.5;
  float offset = 1.33333333;
  vL = vUv - texelSize * offset;
  vR = vUv + texelSize * offset;
  gl_Position = vec4(aPosition, 0.0, 1.0);
}`;

const FRAG_BLUR = `#version 300 es
precision mediump float;
precision mediump sampler2D;
in vec2 vUv;
in vec2 vL;
in vec2 vR;
uniform sampler2D uTexture;
out vec4 FragColor;
void main() {
  vec4 sum = texture(uTexture, vUv) * 0.29411764;
  sum += texture(uTexture, vL) * 0.35294117;
  sum += texture(uTexture, vR) * 0.35294117;
  FragColor = sum;
}`;

const FRAG_COPY = `#version 300 es
precision mediump float;
precision mediump sampler2D;
in vec2 vUv;
uniform sampler2D uTexture;
out vec4 FragColor;
void main() { FragColor = texture(uTexture, vUv); }`;

const FRAG_CLEAR = `#version 300 es
precision mediump float;
precision mediump sampler2D;
in vec2 vUv;
uniform sampler2D uTexture;
uniform float uValue;
uniform float uOff;
out vec4 FragColor;
void main() {
  float x = texture(uTexture, vUv).x;
  FragColor = vec4(uOff + (x - uOff) * uValue, 0.0, 0.0, 1.0);
}`;

const FRAG_SPLAT = `#version 300 es
precision highp float;
precision highp sampler2D;
in vec2 vUv;
uniform sampler2D uTarget;
uniform sampler2D uObstacle;
uniform float uAspect;
uniform vec3 uColor;
uniform vec2 uPoint;
uniform float uRadius;
uniform float uField;
uniform float uVOff;
uniform float uVSpan;
uniform float uVMax;
uniform float uDyeClamp;
out vec4 FragColor;
void main() {
  vec2 p = vUv - uPoint;
  p.x *= uAspect;
  vec3 splat = exp(-dot(p, p) / uRadius) * uColor;
  vec4 ob = texture(uObstacle, vUv);
  vec4 base = texture(uTarget, vUv);
  if (uField < 0.5) {
    vec2 v = (base.xy - uVOff) * uVSpan;
    if (ob.x >= 0.5) v += splat.xy;
    v = clamp(v, -uVMax, uVMax);
    FragColor = vec4(v / uVSpan + uVOff, 0.0, 1.0);
  } else {
    vec3 c = base.rgb + splat.rgb * ob.x;
    if (uDyeClamp > 0.5) c = clamp(c, vec3(0.0), vec3(1.0));
    FragColor = vec4(c, 1.0);
  }
}`;

const FRAG_WIND = `#version 300 es
precision highp float;
precision highp sampler2D;
in vec2 vUv;
uniform sampler2D uVelocity;
uniform sampler2D uObstacle;
uniform float uWindX;
uniform float uRelax;
uniform float uDt;
uniform float uVOff;
uniform float uVSpan;
uniform float uVMax;
out vec4 FragColor;
void main() {
  vec4 ob = texture(uObstacle, vUv);
  if (ob.x < 0.5) { FragColor = vec4(uVOff, uVOff, 0.0, 1.0); return; }
  vec2 v = (texture(uVelocity, vUv).xy - uVOff) * uVSpan;
  float k = 1.0 - exp(-uRelax * uDt);
  v.x = mix(v.x, uWindX, k);
  v = clamp(v, -uVMax, uVMax);
  FragColor = vec4(v / uVSpan + uVOff, 0.0, 1.0);
}`;

const FRAG_ADVECT = `#version 300 es
precision highp float;
precision highp sampler2D;
in vec2 vUv;
uniform sampler2D uVelocity;
uniform sampler2D uSource;
uniform sampler2D uObstacle;
uniform vec2 fVelTexel;
uniform vec2 fDyeTexelSize;
uniform float dt;
uniform float dissipation;
uniform float uField;
uniform float uVOff;
uniform float uVSpan;
uniform float uVMax;
uniform float uDyeClamp;
out vec4 FragColor;
vec4 bilerp(sampler2D sam, vec2 uv, vec2 tsize) {
  vec2 st = uv / tsize - 0.5;
  vec2 iuv = floor(st);
  vec2 fuv = fract(st);
  vec4 a = texture(sam, (iuv + vec2(0.5, 0.5)) * tsize);
  vec4 b = texture(sam, (iuv + vec2(1.5, 0.5)) * tsize);
  vec4 c = texture(sam, (iuv + vec2(0.5, 1.5)) * tsize);
  vec4 d = texture(sam, (iuv + vec2(1.5, 1.5)) * tsize);
  return mix(mix(a, b, fuv.x), mix(c, d, fuv.x), fuv.y);
}
void main() {
  /* 位移用速度网格 texel (fVelTexel), 采样源场用源网格 texel (fDyeTexelSize)
   * 两网格分辨率相同时二者相等, 退化为经典算法 */
  vec2 vel = (bilerp(uVelocity, vUv, fVelTexel).xy - uVOff) * uVSpan;
  vec2 coord = vUv - dt * vel * fVelTexel;
  vec4 result = bilerp(uSource, coord, fDyeTexelSize);
  vec4 ob = texture(uObstacle, vUv);
  float t = dissipation * dt;
  if (uField < 0.5) {
    vec2 rv = (result.xy - uVOff) * uVSpan;
    rv /= (1.0 + t);
    if (ob.x < 0.5) rv = vec2(0.0);
    rv = clamp(rv, -uVMax, uVMax);
    FragColor = vec4(rv / uVSpan + uVOff, 0.0, 1.0);
  } else {
    vec3 rd = result.rgb / (1.0 + t);
    rd *= ob.x;
    if (uDyeClamp > 0.5) rd = clamp(rd, vec3(0.0), vec3(1.0));
    FragColor = vec4(rd, 1.0);
  }
}`;

const FRAG_DIVERGE = `#version 300 es
precision highp float;
precision highp sampler2D;
in vec2 vUv;
in vec2 vL;
in vec2 vR;
in vec2 vT;
in vec2 vB;
uniform sampler2D uVelocity;
uniform sampler2D uObstacle;
uniform float uVOff;
uniform float uVSpan;
uniform float uDOff;
uniform float uDScale;
uniform float uDMax;
out vec4 FragColor;
void main() {
  if (texture(uObstacle, vUv).x < 0.5) { FragColor = vec4(uDOff, 0.0, 0.0, 1.0); return; }
  vec2 C = (texture(uVelocity, vUv).xy - uVOff) * uVSpan;
  float L;
  if (vL.x < 0.0 || texture(uObstacle, vL).x < 0.5) L = -C.x;
  else L = (texture(uVelocity, vL).x - uVOff) * uVSpan;
  float R;
  if (vR.x > 1.0 || texture(uObstacle, vR).x < 0.5) R = -C.x;
  else R = (texture(uVelocity, vR).x - uVOff) * uVSpan;
  float T;
  if (vT.y > 1.0 || texture(uObstacle, vT).x < 0.5) T = -C.y;
  else T = (texture(uVelocity, vT).y - uVOff) * uVSpan;
  float B;
  if (vB.y < 0.0 || texture(uObstacle, vB).x < 0.5) B = -C.y;
  else B = (texture(uVelocity, vB).y - uVOff) * uVSpan;
  float div = 0.5 * (R - L + T - B);
  div = clamp(div, -uDMax, uDMax);
  FragColor = vec4(uDOff + div * uDScale, 0.0, 0.0, 1.0);
}`;

const FRAG_CURL = `#version 300 es
precision highp float;
precision highp sampler2D;
in vec2 vUv;
in vec2 vL;
in vec2 vR;
in vec2 vT;
in vec2 vB;
uniform sampler2D uVelocity;
uniform sampler2D uObstacle;
uniform float uVOff;
uniform float uVSpan;
uniform float uCOff;
uniform float uCScale;
uniform float uCMax;
out vec4 FragColor;
void main() {
  if (texture(uObstacle, vUv).x < 0.5) { FragColor = vec4(uCOff, 0.0, 0.0, 1.0); return; }
  float L = (texture(uVelocity, vL).y - uVOff) * uVSpan;
  float R = (texture(uVelocity, vR).y - uVOff) * uVSpan;
  float T = (texture(uVelocity, vT).x - uVOff) * uVSpan;
  float B = (texture(uVelocity, vB).x - uVOff) * uVSpan;
  float curl = R - L - T + B;
  curl = clamp(curl, -uCMax, uCMax);
  FragColor = vec4(uCOff + curl * uCScale, 0.0, 0.0, 1.0);
}`;

const FRAG_VORT = `#version 300 es
precision highp float;
precision highp sampler2D;
in vec2 vUv;
in vec2 vL;
in vec2 vR;
in vec2 vT;
in vec2 vB;
uniform sampler2D uVelocity;
uniform sampler2D uCurl;
uniform sampler2D uObstacle;
uniform float uStrength;
uniform float uVOff;
uniform float uVSpan;
uniform float uVMax;
uniform float uCOff;
uniform float uCScale;
uniform float dt;
out vec4 FragColor;
void main() {
  if (texture(uObstacle, vUv).x < 0.5) { FragColor = vec4(uVOff, uVOff, 0.0, 1.0); return; }
  float L = (texture(uCurl, vL).x - uCOff) / uCScale;
  float R = (texture(uCurl, vR).x - uCOff) / uCScale;
  float T = (texture(uCurl, vT).x - uCOff) / uCScale;
  float B = (texture(uCurl, vB).x - uCOff) / uCScale;
  float C = (texture(uCurl, vUv).x - uCOff) / uCScale;
  vec2 force = 0.5 * vec2(abs(T) - abs(B), abs(R) - abs(L));
  force /= length(force) + 0.0001;
  force *= uStrength * C;
  force.y *= -1.0;
  vec2 v = (texture(uVelocity, vUv).xy - uVOff) * uVSpan + force * dt;
  v = clamp(v, -uVMax, uVMax);
  FragColor = vec4(v / uVSpan + uVOff, 0.0, 1.0);
}`;

const FRAG_SDFPROJ = `#version 300 es
precision highp float;
precision highp sampler2D;
in vec2 vUv;
in vec2 vL;
in vec2 vR;
in vec2 vT;
in vec2 vB;
uniform sampler2D uVelocity;
uniform sampler2D uObstacle;
uniform float uVOff;
uniform float uVSpan;
uniform float uVMax;
out vec4 FragColor;
void main() {
  if (texture(uObstacle, vUv).x < 0.5) { FragColor = vec4(uVOff, uVOff, 0.0, 1.0); return; }
  vec2 v = (texture(uVelocity, vUv).xy - uVOff) * uVSpan;
  float dL = texture(uObstacle, vL).y;
  float dR = texture(uObstacle, vR).y;
  float dB = texture(uObstacle, vB).y;
  float dT = texture(uObstacle, vT).y;
  vec2 grad = vec2(dR - dL, dT - dB);
  float gradLen = length(grad);
  if (gradLen > 1e-5) {
    vec2 n = grad / gradLen;
    float vn = dot(v, n);
    if (vn < 0.0) v -= vn * n;   /* no-penetration: 只消指向固体内部的法向分量 */
  }
  v = clamp(v, -uVMax, uVMax);
  FragColor = vec4(v / uVSpan + uVOff, 0.0, 1.0);
}`;

const FRAG_PRESSURE = `#version 300 es
precision highp float;
precision highp sampler2D;
in vec2 vUv;
in vec2 vL;
in vec2 vR;
in vec2 vT;
in vec2 vB;
uniform sampler2D uPressure;
uniform sampler2D uDivergence;
uniform sampler2D uObstacle;
uniform float uPOff;
uniform float uPScale;
uniform float uPMax;
uniform float uDOff;
uniform float uDScale;
out vec4 FragColor;
void main() {
  if (texture(uObstacle, vUv).x < 0.5) { FragColor = vec4(uPOff, 0.0, 0.0, 1.0); return; }
  float L = (texture(uPressure, vL).x - uPOff) / uPScale;
  float R = (texture(uPressure, vR).x - uPOff) / uPScale;
  float T = (texture(uPressure, vT).x - uPOff) / uPScale;
  float B = (texture(uPressure, vB).x - uPOff) / uPScale;
  float div = (texture(uDivergence, vUv).x - uDOff) / uDScale;
  float p = (L + R + B + T - div) * 0.25;
  p = clamp(p, -uPMax, uPMax);
  FragColor = vec4(uPOff + p * uPScale, 0.0, 0.0, 1.0);
}`;

const FRAG_GRADIENT = `#version 300 es
precision highp float;
precision highp sampler2D;
in vec2 vUv;
in vec2 vL;
in vec2 vR;
in vec2 vT;
in vec2 vB;
uniform sampler2D uPressure;
uniform sampler2D uVelocity;
uniform sampler2D uObstacle;
uniform float uPOff;
uniform float uPScale;
uniform float uVOff;
uniform float uVSpan;
uniform float uVMax;
out vec4 FragColor;
void main() {
  float Lp = (texture(uPressure, vL).x - uPOff) / uPScale;
  float Rp = (texture(uPressure, vR).x - uPOff) / uPScale;
  float Tp = (texture(uPressure, vT).x - uPOff) / uPScale;
  float Bp = (texture(uPressure, vB).x - uPOff) / uPScale;
  vec2 v = (texture(uVelocity, vUv).xy - uVOff) * uVSpan;
  v -= vec2(Rp - Lp, Tp - Bp);
  if (texture(uObstacle, vUv).x < 0.5) v = vec2(0.0);
  v = clamp(v, -uVMax, uVMax);
  FragColor = vec4(v / uVSpan + uVOff, 0.0, 1.0);
}`;

const FRAG_BLOOM_PREFILTER = `#version 300 es
precision mediump float;
precision mediump sampler2D;
in vec2 vUv;
uniform sampler2D uTexture;
uniform vec3 uCurve;
uniform float uThreshold;
out vec4 FragColor;
void main() {
  vec3 c = texture(uTexture, vUv).rgb;
  float br = max(c.r, max(c.g, c.b));
  float rq = clamp(br - uCurve.x, 0.0, uCurve.y);
  rq = uCurve.z * rq * rq;
  c *= max(rq, br - uThreshold) / max(br, 0.0001);
  FragColor = vec4(c, 0.0);
}`;

const FRAG_DISPLAY = `#version 300 es
precision highp float;
precision highp sampler2D;
in vec2 vUv;
in vec2 vL;
in vec2 vR;
in vec2 vT;
in vec2 vB;
uniform sampler2D uDye;
uniform sampler2D uVelocity;
uniform sampler2D uCurl;
uniform sampler2D uObstacle;
uniform sampler2D uBloom;
uniform sampler2D uDithering;
uniform vec2 uDyeTexel;
uniform vec2 uDitherScale;
uniform float uExposure;
uniform float uSaturation;
uniform float uVignette;
uniform float uBloomStr;
uniform float uGlowStr;
uniform float uGlowRange;
uniform float uGlowCoreGain;
uniform float uGlowSign;
uniform float uCurlScale;
uniform float uCurlOff;
uniform float uVelScale;
uniform vec2 uVelOff;
uniform vec3 uObstacleColor;
out vec4 FragColor;
vec3 acesTonemap(vec3 x) {
  const float a = 2.51; const float b = 0.03;
  const float c = 2.43; const float d = 0.59; const float e = 0.14;
  return clamp((x * (x * a + b)) / (x * (x * c + d) + e), 0.0, 1.0);
}
float luma(vec3 x) { return dot(x, vec3(0.2126, 0.7152, 0.0722)); }
void main() {
  vec3 c = texture(uDye, vUv).rgb;
  float obSolid = 0.0;
  float obG = 1.0;
#ifdef OBSTACLES
  vec4 obc = texture(uObstacle, vUv);
  obSolid = 1.0 - obc.r;
  obG = obc.g;
  c = mix(c, uObstacleColor, obSolid);
  float rim = obSolid * (1.0 - smoothstep(0.0, 0.30, abs(obG - 0.5)));
  c += vec3(0.30, 0.38, 0.52) * rim;
#endif
#ifdef VEL_FIELD
  vec2 velF = (texture(uVelocity, vUv).xy - uVelOff) * uVelScale;
  float speedF = length(velF);
  vec2 dirF = speedF > 1e-4 ? velF / speedF : vec2(0.0);
  vec3 vcol = vec3(0.35, 0.62, 0.95) * 0.55 + vec3(dirF.x, dirF.y, 0.0) * 0.30 + 0.22;
  float lumF = 1.0 - exp(-speedF * 0.05);
  c = vcol * lumF + c * 0.08;
#endif
#ifdef SHADING
  vec3 lc = texture(uDye, vL).rgb;
  vec3 rc = texture(uDye, vR).rgb;
  vec3 tc = texture(uDye, vT).rgb;
  vec3 bc = texture(uDye, vB).rgb;
  float dx = length(rc) - length(lc);
  float dy = length(tc) - length(bc);
  float texelLen = max(length(uDyeTexel), 0.0001);
  vec3 n = normalize(vec3(dx, dy, texelLen));
  vec3 lightDir = normalize(vec3(-0.35, -0.45, 1.0));
  float diffuse = clamp(dot(n, lightDir) + 0.72, 0.72, 1.0);
  c *= diffuse;
  vec2 velS = (texture(uVelocity, vUv).xy - uVelOff) * uVelScale;
  float speedS = length(velS);
  float sheen = speedS / (speedS + 0.35);
  c += vec3(0.025, 0.045, 0.075) * sheen;
#endif
#ifdef VEL_MIX
  vec2 velM = (texture(uVelocity, vUv).xy - uVelOff) * uVelScale;
  float speedM = length(velM);
  c += vec3(0.30, 0.50, 0.85) * clamp(speedM * 0.02, 0.0, 0.5);
#endif
#ifdef VORTEX_GLOW
  float rawCurl = texture(uCurl, vUv).r;
  float curlVal = (rawCurl - uCurlOff) * uCurlScale * uGlowSign;
  float glowRange = max(uGlowRange, 0.0001);
  float pos = smoothstep(0.0, glowRange, curlVal);
  float neg = smoothstep(0.0, glowRange, -curlVal);
  float core = 1.0 - exp(-abs(curlVal) * max(uGlowCoreGain, 0.0));
  vec3 glowTint = vec3(0.05, 1.00, 1.00) * pos + vec3(1.00, 0.10, 0.85) * neg;
  c += glowTint * core * uGlowStr;
  c += vec3(1.0, 1.0, 1.0) * core * uGlowStr * 0.35;
#endif
#ifdef BLOOM
  c += texture(uBloom, vUv).rgb * uBloomStr;
#endif
  c *= uExposure;
#ifdef ACES
  c = acesTonemap(c);
#endif
#ifdef SATURATION
  float lum = luma(c);
  c = mix(vec3(lum), c, clamp(uSaturation, 0.0, 3.0));
#endif
#ifdef VIGNETTE
  vec2 d = vUv - vec2(0.5);
  c *= 1.0 - uVignette * smoothstep(0.25, 1.05, length(d) * 2.0);
#endif
  c = clamp(c, 0.0, 1.0);
  float noise = texture(uDithering, vUv * uDitherScale).r;
  c += (noise * 2.0 - 1.0) * (1.0 / 255.0);
  c = clamp(c, 0.0, 1.0);
  FragColor = vec4(c, 1.0);
}`;
/* ---------------- program / material 基础设施 ---------------- */
function addKeywords(source, keywords) {
  if (!keywords || keywords.length === 0) return source;
  const lines = source.split('\n');
  let defs = '';
  for (let i = 0; i < keywords.length; i++) defs += '#define ' + keywords[i] + '\n';
  return lines[0] + '\n' + defs + lines.slice(1).join('\n');
}

function compileShader(type, source, keywords) {
  source = addKeywords(source, keywords);
  const sh = gl.createShader(type);
  gl.shaderSource(sh, source);
  gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS))
    showErr('shader: ' + gl.getShaderInfoLog(sh));
  return sh;
}

function getUniforms(program) {
  const uniforms = {};
  const n = gl.getProgramParameter(program, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) {
    const name = gl.getActiveUniform(program, i).name;
    uniforms[name] = gl.getUniformLocation(program, name);
  }
  return uniforms;
}

function makeProgram(vertexSrc, fragSrc, keywords) {
  const vs = compileShader(gl.VERTEX_SHADER, vertexSrc);
  const fs = compileShader(gl.FRAGMENT_SHADER, fragSrc, keywords);
  const program = gl.createProgram();
  gl.attachShader(program, vs);
  gl.attachShader(program, fs);
  gl.bindAttribLocation(program, 0, 'aPosition');
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS))
    showErr('link: ' + gl.getProgramInfoLog(program));
  return { program, uniforms: getUniforms(program), bind(){ gl.useProgram(program); } };
}

/* ---------------- blit (全屏四边形) ---------------- */
const blit = (() => {
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, -1,1, 1,1, 1,-1]), gl.STATIC_DRAW);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array([0,1,2, 0,2,3]), gl.STATIC_DRAW);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.enableVertexAttribArray(0);
  return (target) => {
    if (target == null) {
      gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight);
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    } else {
      gl.viewport(0, 0, target.width, target.height);
      gl.bindFramebuffer(gl.FRAMEBUFFER, target.fbo);
    }
    gl.drawElements(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0);
  };
})();

/* ---------------- FBO ---------------- */
function createFBO(w, h, internalFormat, format, type, param, clearColor) {
  gl.activeTexture(gl.TEXTURE0);
  const texture = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, texture);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, param);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, param);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, internalFormat, w, h, 0, format, type, null);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
  const c = clearColor || [0.0, 0.0, 0.0, 1.0];
  gl.clearColor(c[0], c[1], c[2], c[3]);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return {
    texture, fbo, width: w, height: h,
    texelSizeX: 1.0 / w, texelSizeY: 1.0 / h,
    attach(id) {
      gl.activeTexture(gl.TEXTURE0 + id);
      gl.bindTexture(gl.TEXTURE_2D, texture);
      return id;
    }
  };
}

function createDoubleFBO(w, h, internalFormat, format, type, param, clearColor) {
  return {
    width: w, height: h,
    texelSizeX: 1.0 / w, texelSizeY: 1.0 / h,
    read:  createFBO(w, h, internalFormat, format, type, param, clearColor),
    write: createFBO(w, h, internalFormat, format, type, param, clearColor),
    swap() { const t = this.read; this.read = this.write; this.write = t; }
  };
}

function resizeFBO(target, w, h, internalFormat, format, type, param) {
  const nf = createFBO(w, h, internalFormat, format, type, param);
  copyP.bind();
  gl.uniform1i(copyP.uniforms.uTexture, target.attach(0));
  blit(nf);
  return nf;
}

function resizeDoubleFBO(target, w, h, internalFormat, format, type, param, clearColor) {
  if (target.width === w && target.height === h) return target;
  target.read = resizeFBO(target.read, w, h, internalFormat, format, type, param);
  target.write = createFBO(w, h, internalFormat, format, type, param, clearColor);
  target.width = w; target.height = h;
  target.texelSizeX = 1.0 / w; target.texelSizeY = 1.0 / h;
  return target;
}

function getResolution(resolution) {
  if (gl.drawingBufferWidth < 2 || gl.drawingBufferHeight < 2)
    return { width: Math.round(resolution * 16 / 9), height: Math.round(resolution) };
  const ar0 = gl.drawingBufferWidth / gl.drawingBufferHeight;
  let ar = ar0 < 1.0 ? 1.0 / ar0 : ar0;
  const min = Math.round(resolution);
  const max = Math.round(resolution * ar);
  return gl.drawingBufferWidth >= gl.drawingBufferHeight
    ? { width: max, height: min }
    : { width: min, height: max };
}

/* display: keywords 按显示模式动态构建 */
let displayP = null;
function ensureDisplayProgram() {
  const kw = ['BLOOM', 'VORTEX_GLOW', 'ACES', 'SATURATION', 'VIGNETTE'];
  if (obstacles.length > 0) kw.push('OBSTACLES');
  if (config.displayMode === 1) kw.push('VEL_FIELD');
  else { kw.push('SHADING'); if (config.displayMode === 2) kw.push('VEL_MIX'); }
  const key = kw.sort().join('|');
  if (displayP && displayP._key === key) return;
  displayP = makeProgram(VERT_BASE, FRAG_DISPLAY, kw);
  displayP._key = key;
}

/* ---------------- dithering 蓝噪声 (代码生成, 无外部图片) ---------------- */
let dithering = null;
function createDitheringTexture() {
  const size = 256;
  const data = new Uint8Array(size * size * 4);
  let seed = 12345;
  const rand = () => { seed = (seed * 16807) % 2147483647; return (seed & 0xffff) / 65536; };
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const i = (y * size + x) * 4;
      const n = (x * 173 + y * 271 + ((x ^ y) & 0xff)) & 0xff;
      const v = Math.min(255, Math.max(0, Math.round((n * 0.6 + rand() * 255 * 0.4))));
      data[i] = data[i+1] = data[i+2] = v;
      data[i+3] = 255;
    }
  }
  const f = createFBO(size, size, rgba8Internal, gl.RGBA, gl.UNSIGNED_BYTE, gl.LINEAR);
  gl.bindTexture(gl.TEXTURE_2D, f.texture);
  gl.texImage2D(gl.TEXTURE_2D, 0, rgba8Internal, size, size, 0, gl.RGBA, gl.UNSIGNED_BYTE, data);
  return f;
}

/* ---------------- 场 ---------------- */
let dye = null, velocity = null, divergence = null, curl = null, pressure = null;
let obstacleFBO = null;
let bloomA = null, bloomB = null;

function initFramebuffers() {
  const simRes = getResolution(config.SIM_RESOLUTION);
  const dyeRes2 = getResolution(dyeRes);
  const texType = ext.texType;
  const rgba = ext.formatRGBA, rg = ext.formatRG, r = ext.formatR;
  const filtering = ext.supportLinearFiltering ? gl.LINEAR : gl.NEAREST;
  gl.disable(gl.BLEND);

  const dyeClear = [0.0, 0.0, 0.0, 1.0];
  const velClear = [Q.vOff, Q.vOff, 0.0, 1.0];
  const pClear = [Q.pOff, 0.0, 0.0, 1.0];
  const dClear = [Q.dOff, 0.0, 0.0, 1.0];
  const cClear = [Q.cOff, 0.0, 0.0, 1.0];

  if (dye == null)
    dye = createDoubleFBO(dyeRes2.width, dyeRes2.height, rgba.internalFormat, rgba.format, texType, filtering, dyeClear);
  else
    dye = resizeDoubleFBO(dye, dyeRes2.width, dyeRes2.height, rgba.internalFormat, rgba.format, texType, filtering, dyeClear);

  if (velocity == null)
    velocity = createDoubleFBO(simRes.width, simRes.height, rg.internalFormat, rg.format, texType, filtering, velClear);
  else
    velocity = resizeDoubleFBO(velocity, simRes.width, simRes.height, rg.internalFormat, rg.format, texType, filtering, velClear);

  divergence = createFBO(simRes.width, simRes.height, r.internalFormat, r.format, texType, gl.NEAREST, dClear);
  curl = createFBO(simRes.width, simRes.height, r.internalFormat, r.format, texType, gl.NEAREST, cClear);
  pressure = createDoubleFBO(simRes.width, simRes.height, r.internalFormat, r.format, texType, gl.NEAREST, pClear);

  obstacleFBO = createFBO(simRes.width, simRes.height, rgba8Internal, gl.RGBA, gl.UNSIGNED_BYTE, gl.LINEAR);

  const bres = getResolution(config.BLOOM_RESOLUTION);
  const bClear = [0.0, 0.0, 0.0, 1.0];
  bloomA = createFBO(bres.width, bres.height, rgba.internalFormat, rgba.format, texType, filtering, bClear);
  bloomB = createFBO(bres.width, bres.height, rgba.internalFormat, rgba.format, texType, filtering, bClear);

  if (dithering == null) dithering = createDitheringTexture();
  displayP = null;
  /* 任何 reinit 都会清零 obstacleFBO, 必须重绘 mask, 否则全场变"全固体" */
  maskDirty = true;
}

/* ---------------- 障碍物 SDF mask ---------------- */
let maskData = null;
function paintObstacleMask() {
  const W = obstacleFBO.width, H = obstacleFBO.height;
  if (!maskData || maskData.length !== W * H * 4) maskData = new Uint8Array(W * H * 4);
  const data = maskData;
  const soft = 0.03;
  for (let j = 0; j < H; j++) {
    const uy = 1.0 - (j + 0.5) / H;
    for (let i = 0; i < W; i++) {
      const ux = (i + 0.5) / W;
      let dMin = 1.0;
      for (let k = 0; k < obstacles.length; k++) {
        const ob = obstacles[k];
        let d;
        if (ob.shape === 'circle') {
          const dx = ux - ob.x, dy = uy - ob.y;
          d = Math.sqrt(dx*dx + dy*dy) - ob.r;
        } else {
          const dx = ux - ob.x, dy = uy - ob.y;
          const c = Math.cos(-ob.rot), s = Math.sin(-ob.rot);
          const lx = dx * c - dy * s, ly = dx * s + dy * c;
          const qx = Math.abs(lx) - ob.r, qy = Math.abs(ly) - ob.r;
          if (qx > 0 && qy > 0) d = Math.sqrt(qx*qx + qy*qy);
          else if (qx > 0) d = qx;
          else if (qy > 0) d = qy;
          else d = -Math.sqrt(qx*qx + qy*qy);
        }
        if (d < dMin) dMin = d;
      }
      const idx = (j * W + i) * 4;
      data[idx] = dMin < 0.0 ? 0 : 255;
      data[idx+1] = Math.max(0, Math.min(255, Math.round(255 * (0.5 + dMin / soft))));
      data[idx+2] = 0;
      data[idx+3] = 255;
    }
  }
  gl.bindTexture(gl.TEXTURE_2D, obstacleFBO.texture);
  gl.texImage2D(gl.TEXTURE_2D, 0, rgba8Internal, W, H, 0, gl.RGBA, gl.UNSIGNED_BYTE, data);
}

function addObstacle(shape, x, y, r, rot) {
  obstacles.push({ shape, x, y, r, rot: rot || 0 });
  maskDirty = true;
  renderObList();
}
function removeObstacle(i) {
  obstacles.splice(i, 1);
  maskDirty = true;
  renderObList();
}
function hitObstacle(x, y) {
  for (let i = obstacles.length - 1; i >= 0; i--) {
    const ob = obstacles[i];
    if (ob.shape === 'circle') {
      const dx = x - ob.x, dy = y - ob.y;
      if (dx*dx + dy*dy < (ob.r + 0.015) * (ob.r + 0.015)) return i;
    } else {
      const dx = x - ob.x, dy = y - ob.y;
      const c = Math.cos(-ob.rot), s = Math.sin(-ob.rot);
      const lx = dx * c - dy * s, ly = dx * s + dy * c;
      if (Math.abs(lx) < ob.r + 0.015 && Math.abs(ly) < ob.r + 0.015) return i;
    }
  }
  return -1;
}
function renderObList() {
  const el = document.getElementById('obList');
  el.innerHTML = '';
  obstacles.forEach((ob, i) => {
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.innerHTML = (ob.shape === 'circle' ? '⬤' : '■') + ' <b>' + ob.r.toFixed(3) + '</b><span class="x">✕</span>';
    chip.querySelector('.x').addEventListener('click', () => removeObstacle(i));
    el.appendChild(chip);
  });
}
function clearFields() {
  gl.bindFramebuffer(gl.FRAMEBUFFER, dye.read.fbo);
  gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.bindFramebuffer(gl.FRAMEBUFFER, dye.write.fbo);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.bindFramebuffer(gl.FRAMEBUFFER, velocity.read.fbo);
  gl.clearColor(Q.vOff, Q.vOff, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.bindFramebuffer(gl.FRAMEBUFFER, velocity.write.fbo);
  gl.clear(gl.COLOR_BUFFER_BIT);
}

/* ---------------- splat ---------------- */
function correctRadius(radius) {
  const ar = canvas.width / canvas.height;
  if (ar > 1.0) radius *= ar;
  return radius;
}

function splat(x, y, dx, dy, cr, cg, cb, radius) {
  splatP.bind();
  const u = splatP.uniforms;
  gl.uniform1f(u.uAspect, canvas.width / canvas.height);
  gl.uniform2f(u.uPoint, x, y);
  gl.uniform1f(u.uRadius, correctRadius(radius * radius));
  gl.uniform1f(u.uVOff, Q.vOff);
  gl.uniform1f(u.uVSpan, Q.vSpan);
  gl.uniform1f(u.uVMax, Q.vMax);
  gl.uniform1f(u.uDyeClamp, Q.dyeClamp);
  gl.uniform1i(u.uObstacle, obstacleFBO.attach(1));
  gl.uniform1i(u.uTarget, velocity.read.attach(0));
  gl.uniform1f(u.uField, 0.0);
  gl.uniform3f(u.uColor, dx, dy, 0.0);
  blit(velocity.write); velocity.swap();
  gl.uniform1i(u.uTarget, dye.read.attach(0));
  gl.uniform1f(u.uField, 1.0);
  gl.uniform3f(u.uColor, cr, cg, cb);
  blit(dye.write); dye.swap();
}

function generateColor() {
  const c = hsv(Math.random(), 0.9, 1.0);
  const m = floatFields ? 0.35 : 0.6;
  return [c[0]*m, c[1]*m, c[2]*m];
}

function splashBurst(n) {
  for (let i = 0; i < n; i++) {
    const x = 0.15 + 0.7 * Math.random(), y = 0.15 + 0.7 * Math.random();
    const a = Math.random() * Math.PI * 2;
    const f = 250 + Math.random() * 500;
    const c = hsv((i / n + 0.5) % 1, 0.9, 1.0);
    splat(x, y, Math.cos(a) * f, Math.sin(a) * f, c[0]*0.5, c[1]*0.5, c[2]*0.5, 0.008);
  }
}

function injectDemo(dt) {
  const f = clamp(dt, 0.001, 0.0166) * 60.0;
  const now = performance.now() * 0.0006;
  const wind = config.wind;
  if (mode === 'vortex' || mode === 'array') {
    const rows = 7;
    for (let k = 0; k < rows; k++) {
      const y = 0.07 + k * (0.86 / (rows - 1)) + 0.015 * Math.sin(now + k * 1.9);
      const hue = (0.50 + 0.16 * Math.sin(now * 0.7 + k * 0.9) + (k / rows) * 0.10) % 1;
      const c = hsv(hue, 0.9, 1.0);
      const dA = wind * 0.011 * f;
      splat(0.03, y, dA, 0.0, c[0]*0.45*f, c[1]*0.45*f, c[2]*0.45*f, 0.010);
    }
  } else if (mode === 'jet') {
    const A = wind * 0.011 * f;
    const cA = hsv(0.55, 0.9, 1.0), cB = hsv(0.02, 0.9, 1.0);
    splat(0.03, 0.36, A, 0, cA[0]*0.35*f, cA[1]*0.35*f, cA[2]*0.35*f, 0.008);
    splat(0.03, 0.64, A, 0, cB[0]*0.35*f, cB[1]*0.35*f, cB[2]*0.35*f, 0.008);
  } else if (mode === 'turb') {
    for (let k = 0; k < 5; k++) {
      const x = 0.12 + 0.76 * Math.random();
      const y = 0.12 + 0.76 * Math.random();
      const a = Math.random() * Math.PI * 2;
      const ff = (0.20 + 0.35 * Math.random()) * f * 35 * (wind / 40);
      const hue = (hueBase + k * 0.09) % 1;
      const c = hsv(hue, 0.9, 1.0);
      splat(x, y, Math.cos(a)*ff, Math.sin(a)*ff, c[0]*0.45*f, c[1]*0.45*f, c[2]*0.45*f, 0.011);
    }
    hueBase = (hueBase + 0.0012 * f) % 1;
  }
}

/* ---------------- step (标准 Stam 顺序 + 障碍物) ----------------
 * splats → curl → vorticity → SDF投影(pre) → advect vel
 * → divergence(no-flux) → clear pressure → Jacobi(Dirichlet)
 * → gradient subtract → SDF投影(post) → advect dye */
function step(dt) {
  gl.disable(gl.BLEND);
  const tx = velocity.texelSizeX, ty = velocity.texelSizeY;
  const u = (p) => p.uniforms;

  /* 1. 指针搅动 + 演示注入 + 弱来流 */
  for (let i = 0; i < pointerQueue.length; i++) {
    const p = pointerQueue[i];
    splat(p.x, p.y, p.dx * 5500, p.dy * 5500, p.cr, p.cg, p.cb, 0.006);
  }
  pointerQueue.length = 0;
  injectDemo(dt);

  const windA = (mode === 'vortex' || mode === 'array') ? config.wind * 0.5
             : (mode === 'turb' ? config.wind * 0.12 : 0);
  if (windA > 0) {
    windP.bind();
    gl.uniform1f(u(windP).uWindX, windA);
    gl.uniform1f(u(windP).uRelax, 6.0);
    gl.uniform1f(u(windP).uDt, dt);
    gl.uniform1f(u(windP).uVOff, Q.vOff);
    gl.uniform1f(u(windP).uVSpan, Q.vSpan);
    gl.uniform1f(u(windP).uVMax, Q.vMax);
    gl.uniform1i(u(windP).uObstacle, obstacleFBO.attach(1));
    gl.uniform1i(u(windP).uVelocity, velocity.read.attach(0));
    blit(velocity.write); velocity.swap();
  }

  /* 2. curl */
  curlP.bind();
  gl.uniform2f(u(curlP).texelSize, tx, ty);
  gl.uniform1f(u(curlP).uVOff, Q.vOff);
  gl.uniform1f(u(curlP).uVSpan, Q.vSpan);
  gl.uniform1f(u(curlP).uCOff, Q.cOff);
  gl.uniform1f(u(curlP).uCScale, Q.cScale);
  gl.uniform1f(u(curlP).uCMax, Q.cMax);
  gl.uniform1i(u(curlP).uObstacle, obstacleFBO.attach(1));
  gl.uniform1i(u(curlP).uVelocity, velocity.read.attach(0));
  blit(curl);

  /* 3. vorticity confinement */
  if (config.CURL > 0) {
    vortP.bind();
    gl.uniform2f(u(vortP).texelSize, tx, ty);
    gl.uniform1f(u(vortP).uStrength, config.CURL);
    gl.uniform1f(u(vortP).uVOff, Q.vOff);
    gl.uniform1f(u(vortP).uVSpan, Q.vSpan);
    gl.uniform1f(u(vortP).uVMax, Q.vMax);
    gl.uniform1f(u(vortP).uCOff, Q.cOff);
    gl.uniform1f(u(vortP).uCScale, Q.cScale);
    gl.uniform1f(u(vortP).dt, dt);
    gl.uniform1i(u(vortP).uObstacle, obstacleFBO.attach(2));
    gl.uniform1i(u(vortP).uCurl, curl.attach(1));
    gl.uniform1i(u(vortP).uVelocity, velocity.read.attach(0));
    blit(velocity.write); velocity.swap();
  }

  /* 4. SDF 投影 (pre-advection) */
  if (obstacles.length > 0) {
    sdfProjP.bind();
    gl.uniform2f(u(sdfProjP).texelSize, tx, ty);
    gl.uniform1f(u(sdfProjP).uVOff, Q.vOff);
    gl.uniform1f(u(sdfProjP).uVSpan, Q.vSpan);
    gl.uniform1f(u(sdfProjP).uVMax, Q.vMax);
    gl.uniform1i(u(sdfProjP).uObstacle, obstacleFBO.attach(1));
    gl.uniform1i(u(sdfProjP).uVelocity, velocity.read.attach(0));
    blit(velocity.write); velocity.swap();
  }

  /* 5. advect velocity */
  advectP.bind();
  gl.uniform2f(u(advectP).fVelTexel, tx, ty);
  gl.uniform2f(u(advectP).fDyeTexelSize, tx, ty);
  gl.uniform1f(u(advectP).dt, dt);
  gl.uniform1f(u(advectP).dissipation, config.VELOCITY_DISSIPATION);
  gl.uniform1f(u(advectP).uField, 0.0);
  gl.uniform1f(u(advectP).uVOff, Q.vOff);
  gl.uniform1f(u(advectP).uVSpan, Q.vSpan);
  gl.uniform1f(u(advectP).uVMax, Q.vMax);
  gl.uniform1f(u(advectP).uDyeClamp, Q.dyeClamp);
  gl.uniform1i(u(advectP).uObstacle, obstacleFBO.attach(2));
  const velId = velocity.read.attach(0);
  gl.uniform1i(u(advectP).uVelocity, velId);
  gl.uniform1i(u(advectP).uSource, velId);
  blit(velocity.write); velocity.swap();

  /* 6. divergence (no-flux 边界) */
  divergeP.bind();
  gl.uniform2f(u(divergeP).texelSize, tx, ty);
  gl.uniform1f(u(divergeP).uVOff, Q.vOff);
  gl.uniform1f(u(divergeP).uVSpan, Q.vSpan);
  gl.uniform1f(u(divergeP).uDOff, Q.dOff);
  gl.uniform1f(u(divergeP).uDScale, Q.dScale);
  gl.uniform1f(u(divergeP).uDMax, Q.dMax);
  gl.uniform1i(u(divergeP).uObstacle, obstacleFBO.attach(1));
  gl.uniform1i(u(divergeP).uVelocity, velocity.read.attach(0));
  blit(divergence);

  /* 7. clear pressure (向 0 衰减, 8bit 下向 offset 衰减) */
  clearP.bind();
  gl.uniform1f(u(clearP).uValue, config.PRESSURE);
  gl.uniform1f(u(clearP).uOff, Q.pOff);
  gl.uniform1i(u(clearP).uTexture, pressure.read.attach(0));
  blit(pressure.write); pressure.swap();

  /* 8. Jacobi */
  pressureP.bind();
  gl.uniform2f(u(pressureP).texelSize, tx, ty);
  gl.uniform1f(u(pressureP).uPOff, Q.pOff);
  gl.uniform1f(u(pressureP).uPScale, Q.pScale);
  gl.uniform1f(u(pressureP).uPMax, Q.pMax);
  gl.uniform1f(u(pressureP).uDOff, Q.dOff);
  gl.uniform1f(u(pressureP).uDScale, Q.dScale);
  gl.uniform1i(u(pressureP).uDivergence, divergence.attach(1));
  gl.uniform1i(u(pressureP).uObstacle, obstacleFBO.attach(2));
  for (let i = 0; i < config.PRESSURE_ITERATIONS; i++) {
    gl.uniform1i(u(pressureP).uPressure, pressure.read.attach(0));
    blit(pressure.write); pressure.swap();
  }

  /* 9. gradient subtract */
  gradientP.bind();
  gl.uniform2f(u(gradientP).texelSize, tx, ty);
  gl.uniform1f(u(gradientP).uPOff, Q.pOff);
  gl.uniform1f(u(gradientP).uPScale, Q.pScale);
  gl.uniform1f(u(gradientP).uVOff, Q.vOff);
  gl.uniform1f(u(gradientP).uVSpan, Q.vSpan);
  gl.uniform1f(u(gradientP).uVMax, Q.vMax);
  gl.uniform1i(u(gradientP).uObstacle, obstacleFBO.attach(2));
  gl.uniform1i(u(gradientP).uPressure, pressure.read.attach(0));
  gl.uniform1i(u(gradientP).uVelocity, velocity.read.attach(1));
  blit(velocity.write); velocity.swap();

  /* 10. SDF 投影 (post-gradient) */
  if (obstacles.length > 0) {
    sdfProjP.bind();
    gl.uniform2f(u(sdfProjP).texelSize, tx, ty);
    gl.uniform1f(u(sdfProjP).uVOff, Q.vOff);
    gl.uniform1f(u(sdfProjP).uVSpan, Q.vSpan);
    gl.uniform1f(u(sdfProjP).uVMax, Q.vMax);
    gl.uniform1i(u(sdfProjP).uObstacle, obstacleFBO.attach(1));
    gl.uniform1i(u(sdfProjP).uVelocity, velocity.read.attach(0));
    blit(velocity.write); velocity.swap();
  }

  /* 11. advect dye */
  advectP.bind();
  gl.uniform2f(u(advectP).fVelTexel, tx, ty);
  gl.uniform2f(u(advectP).fDyeTexelSize, dye.texelSizeX, dye.texelSizeY);
  gl.uniform1f(u(advectP).dt, dt);
  gl.uniform1f(u(advectP).dissipation, config.DENSITY_DISSIPATION);
  gl.uniform1f(u(advectP).uField, 1.0);
  gl.uniform1f(u(advectP).uVOff, Q.vOff);
  gl.uniform1f(u(advectP).uVSpan, Q.vSpan);
  gl.uniform1f(u(advectP).uVMax, Q.vMax);
  gl.uniform1f(u(advectP).uDyeClamp, Q.dyeClamp);
  gl.uniform1i(u(advectP).uObstacle, obstacleFBO.attach(2));
  gl.uniform1i(u(advectP).uVelocity, velocity.read.attach(0));
  gl.uniform1i(u(advectP).uSource, dye.read.attach(1));
  blit(dye.write); dye.swap();
}

/* ---------------- render ---------------- */
function applyBloom2Level() {
  const src = dye.read;
  gl.disable(gl.BLEND);
  bloomPreP.bind();
  const p = bloomPreP.uniforms;
  const knee = config.BLOOM_THRESHOLD * config.BLOOM_SOFT_KNEE + 0.0001;
  gl.uniform3f(p.uCurve, config.BLOOM_THRESHOLD - knee, knee * 2.0, 0.25 / knee);
  gl.uniform1f(p.uThreshold, config.BLOOM_THRESHOLD);
  gl.uniform1i(p.uTexture, src.attach(0));
  blit(bloomA);
  /* 2 级 separable gaussian (sigma≈1 + sigma≈2, 3-tap) */
  blurP.bind();
  const b = blurP.uniforms;
  gl.uniform1i(b.uTexture, bloomA.attach(0));
  gl.uniform2f(b.texelSize, 1.0 / bloomA.width, 0.0);
  blit(bloomB);
  gl.uniform1i(b.uTexture, bloomB.attach(0));
  gl.uniform2f(b.texelSize, 0.0, 1.0 / bloomA.height);
  blit(bloomA);
  gl.uniform1i(b.uTexture, bloomA.attach(0));
  gl.uniform2f(b.texelSize, 2.0 / bloomA.width, 0.0);
  blit(bloomB);
  gl.uniform1i(b.uTexture, bloomB.attach(0));
  gl.uniform2f(b.texelSize, 0.0, 2.0 / bloomA.height);
  blit(bloomA);
}

function render() {
  if (config.BLOOM) applyBloom2Level();
  ensureDisplayProgram();
  const u = displayP.uniforms;
  const w = gl.drawingBufferWidth, h = gl.drawingBufferHeight;
  gl.uniform2f(u.uDyeTexel, dye.texelSizeX, dye.texelSizeY);
  gl.uniform2f(u.uDitherScale, w / dithering.width, h / dithering.height);
  gl.uniform1f(u.uExposure, 1.15);
  gl.uniform1f(u.uSaturation, 1.25);
  gl.uniform1f(u.uVignette, 0.36);
  gl.uniform1f(u.uBloomStr, config.BLOOM_INTENSITY);
  gl.uniform1f(u.uGlowStr, config.glow);
  gl.uniform1f(u.uGlowRange, 0.35);
  gl.uniform1f(u.uGlowCoreGain, 6.0);
  gl.uniform1f(u.uGlowSign, 1.0);
  gl.uniform1f(u.uCurlScale, floatFields ? 1.0 : 1.0 / Q.cScale);
  gl.uniform1f(u.uCurlOff, Q.cOff);
  gl.uniform1f(u.uVelScale, floatFields ? 1.0 : Q.vSpan);
  gl.uniform2f(u.uVelOff, Q.vOff, Q.vOff);
  gl.uniform3f(u.uObstacleColor, 0.24, 0.28, 0.36);
  gl.uniform1i(u.uDye, dye.read.attach(0));
  gl.uniform1i(u.uVelocity, velocity.read.attach(1));
  gl.uniform1i(u.uCurl, curl.attach(2));
  gl.uniform1i(u.uObstacle, obstacleFBO.attach(3));
  gl.uniform1i(u.uBloom, bloomA.attach(4));
  gl.uniform1i(u.uDithering, dithering.attach(5));
  blit(null);
}

/* ---------------- 障碍物预设 ---------------- */
function setMode(m) {
  mode = m;
  document.querySelectorAll('#modeBtns .btn').forEach(b => b.classList.toggle('active', b.dataset.mode === m));
  obstacles = LAYOUTS[m]();
  maskDirty = true;
  clearFields();
  renderObList();
  toast(MODE_INFO[m]);
}
document.querySelectorAll('#modeBtns .btn').forEach(btn => {
  btn.addEventListener('click', () => setMode(btn.dataset.mode));
});

/* ---------------- 指针交互 ---------------- */
function toUV(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width, y: 1 - (e.clientY - r.top) / r.height };
}
let drag = null;
let lpTimer = null, lpPt = null, lpMoved = false;
let lastUserT = performance.now(), lastAutoT = 0;
canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  lastUserT = performance.now();
  const uv = toUV(e);
  const idx = hitObstacle(uv.x, uv.y);
  if (idx >= 0) { drag = { type:'ob', i: idx }; canvas.classList.add('grabbing'); }
  else drag = { type:'stir', last: uv };
  try { canvas.setPointerCapture(e.pointerId); } catch(err){}
  lpPt = { x: e.clientX, y: e.clientY }; lpMoved = false;
  clearTimeout(lpTimer);
  lpTimer = setTimeout(() => {
    if (lpMoved || !lpPt) return;
    const p = lpPt; lpPt = null;
    const uv2 = toUV(p);
    const i2 = hitObstacle(uv2.x, uv2.y);
    if (i2 >= 0) { removeObstacle(i2); toast('已删除障碍物（长按）'); }
    else { addObstacle('circle', uv2.x, uv2.y, nextSize); toast('已添加圆形障碍（长按）'); }
    drag = null;
  }, 550);
});
canvas.addEventListener('pointermove', (e) => {
  if (lpPt) {
    const mdx = e.clientX - lpPt.x, mdy = e.clientY - lpPt.y;
    if (mdx*mdx + mdy*mdy > 144) { lpMoved = true; clearTimeout(lpTimer); lpPt = null; }
  }
  const uv = toUV(e);
  if (!drag) {
    canvas.classList.toggle('grab', hitObstacle(uv.x, uv.y) >= 0);
    return;
  }
  lastUserT = performance.now();
  if (drag.type === 'ob') {
    const ob = obstacles[drag.i];
    if (!ob) { drag = null; return; }
    if (e.shiftKey && ob.shape === 'box') ob.rot = Math.atan2(uv.y - ob.y, uv.x - ob.x);
    else { ob.x = clamp(uv.x, 0.02, 0.98); ob.y = clamp(uv.y, 0.02, 0.98); }
    maskDirty = true;
  } else {
    const dx = uv.x - drag.last.x, dy = uv.y - drag.last.y;
    drag.last = uv;
    hueBase = (hueBase + 0.002 + Math.abs(dx) * 0.5) % 1;
    const c = hsv(hueBase, 0.85, 1.0);
    pointerQueue.push({ x:uv.x, y:uv.y, dx, dy, cr:c[0]*0.5, cg:c[1]*0.5, cb:c[2]*0.5 });
  }
});
window.addEventListener('pointerup', () => { drag = null; canvas.classList.remove('grabbing'); clearTimeout(lpTimer); lpPt = null; });
canvas.addEventListener('dblclick', (e) => {
  const uv = toUV(e);
  const idx = hitObstacle(uv.x, uv.y);
  if (idx >= 0) removeObstacle(idx);
  else addObstacle('circle', uv.x, uv.y, nextSize);
});
canvas.addEventListener('contextmenu', (e) => {
  e.preventDefault();
  const uv = toUV(e);
  const idx = hitObstacle(uv.x, uv.y);
  if (idx >= 0) removeObstacle(idx);
});
canvas.addEventListener('wheel', (e) => {
  const uv = toUV(e);
  const idx = hitObstacle(uv.x, uv.y);
  if (idx >= 0) {
    e.preventDefault();
    const ob = obstacles[idx];
    ob.r = clamp(ob.r * (e.deltaY > 0 ? 0.93 : 1.07), 0.02, 0.22);
    maskDirty = true;
  }
}, { passive:false });

/* ---------------- UI 绑定 (JS 先设值再绑定, 防止 value 属性覆盖) ---------------- */
function bindRange(id, valId, fn, fmt) {
  const el = document.getElementById(id), v = document.getElementById(valId);
  const upd = () => { const x = parseFloat(el.value); v.textContent = fmt ? fmt(x) : x; fn(x); };
  el.addEventListener('input', upd);
  upd();
}
document.getElementById('sWind').value = config.wind;
document.getElementById('sVort').value = config.CURL;
document.getElementById('sVisc').value = config.VELOCITY_DISSIPATION;
document.getElementById('sDye').value = config.DENSITY_DISSIPATION;
document.getElementById('sIter').value = config.PRESSURE_ITERATIONS;
document.getElementById('sRes').value = config.SIM_RESOLUTION;
document.getElementById('sBloom').value = config.BLOOM_INTENSITY;
document.getElementById('sGlow').value = config.glow;
bindRange('sWind', 'vWind',  x => config.wind = x);
bindRange('sVort', 'vVort',  x => config.CURL = x);
bindRange('sVisc', 'vVisc',  x => config.VELOCITY_DISSIPATION = x, x => x.toFixed(2));
bindRange('sDye',  'vDye',   x => config.DENSITY_DISSIPATION = x, x => x.toFixed(1));
bindRange('sIter', 'vIter',  x => config.PRESSURE_ITERATIONS = Math.round(x));
bindRange('sRes',  'vRes',   x => { const r = Math.round(x); if (r !== config.SIM_RESOLUTION) { config.SIM_RESOLUTION = r; initFramebuffers(); } });
bindRange('sBloom','vBloom', x => config.BLOOM_INTENSITY = x, x => x.toFixed(2));
bindRange('sGlow', 'vGlow',  x => config.glow = x, x => x.toFixed(2));
bindRange('sSize', 'vSize',  x => nextSize = x, x => x.toFixed(3));
document.getElementById('selMode').addEventListener('change', e => config.displayMode = parseFloat(e.target.value));

const pauseBtn = document.getElementById('pauseBtn');
pauseBtn.addEventListener('click', () => {
  config.PAUSED = !config.PAUSED;
  pauseBtn.textContent = config.PAUSED ? '▶ 继续' : '⏸ 暂停';
  pauseBtn.classList.toggle('active', config.PAUSED);
});
document.getElementById('clearBtn').addEventListener('click', () => { clearFields(); toast('已清除染料与速度场'); });
document.getElementById('panelBtn').addEventListener('click', () => document.getElementById('panel').classList.toggle('closed'));
if (window.innerWidth < 680) document.getElementById('panel').classList.add('closed');

document.getElementById('addCircle').addEventListener('click', () => addObstacle('circle', 0.3 + Math.random()*0.4, 0.3 + Math.random()*0.4, nextSize));
document.getElementById('addBox').addEventListener('click', () => addObstacle('box', 0.3 + Math.random()*0.4, 0.3 + Math.random()*0.4, nextSize*1.2, Math.random()*Math.PI));
document.getElementById('clearObs').addEventListener('click', () => { obstacles = []; maskDirty = true; renderObList(); });
document.getElementById('randObs').addEventListener('click', () => {
  obstacles = [];
  const n = 3 + Math.floor(Math.random()*3);
  for (let i = 0; i < n; i++) {
    const shape = Math.random() < 0.6 ? 'circle' : 'box';
    addObstacle(shape, 0.2 + Math.random()*0.6, 0.2 + Math.random()*0.6, 0.03 + Math.random()*0.06, Math.random()*Math.PI);
  }
});
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) {
    e.preventDefault();
    pauseBtn.click();
  }
});

let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3200);
}

/* ---------------- 主循环 + 自适应降质 ---------------- */
let last = performance.now();
let fps = 60, frames = 0, lastFpsT = performance.now();
let qChecks = 0, lastDowngradeT = 0;
function updateStats(now) {
  frames++;
  if (now - lastFpsT >= 500) {
    fps = Math.round(frames * 1000 / (now - lastFpsT));
    frames = 0; lastFpsT = now;
    qChecks++;
    if (qChecks >= 4) {
      qChecks = 0;
      if (fps < 42 && now - lastDowngradeT > 5000) {
        lastDowngradeT = now;
        if (dyeRes > 256) {
          dyeRes = Math.max(256, dyeRes >> 1);
          initFramebuffers();
          toast('性能保护：染料分辨率已自动降低');
        } else if (config.SIM_RESOLUTION > 96) {
          const r = Math.max(96, Math.round(config.SIM_RESOLUTION * 0.75 / 8) * 8);
          config.SIM_RESOLUTION = r;
          document.getElementById('sRes').value = r;
          document.getElementById('vRes').textContent = r;
          initFramebuffers();
        }
      }
    }
    const windStr = (mode === 'vortex' || mode === 'array') ? ' · 来流 ' + config.wind : (mode === 'jet' ? ' · 射流 ' + config.wind : '');
    document.getElementById('stats').textContent =
      fps + ' FPS · 网格 ' + velocity.width + '×' + velocity.height + ' · 染料 ' + dye.width + '×' + dye.height +
      ' · 障碍物 ' + obstacles.length + windStr + (config.PAUSED ? ' · ⏸ 已暂停' : '') +
      (floatFields ? '' : ' · 8bit回退');
  }
}
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000;
  last = now;
  dt = clamp(dt, 0.001, 0.0166);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(2, Math.floor(canvas.clientWidth * dpr));
  const h = Math.max(2, Math.floor(canvas.clientHeight * dpr));
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w; canvas.height = h;
    initFramebuffers();
  }
  if (maskDirty) { paintObstacleMask(); maskDirty = false; }
  if (!config.PAUSED) {
    if (now - lastUserT > 4500 && now - lastAutoT > 1500) {
      lastAutoT = now;
      const ax = 0.2 + 0.6 * Math.random(), ay = 0.2 + 0.6 * Math.random();
      const aa = Math.random() * Math.PI * 2;
      const af = 50 + Math.random() * 130;
      const ac = hsv(hueBase, 0.85, 1.0);
      pointerQueue.push({ x:ax, y:ay, dx:Math.cos(aa)*af/5500, dy:Math.sin(aa)*af/5500, cr:ac[0]*0.5, cg:ac[1]*0.5, cb:ac[2]*0.5 });
    }
    step(dt);
  }
  render();
  updateStats(now);
}

/* ---------------- 启动 ---------------- */
initFramebuffers();
setMode('vortex');
splashBurst(10);
requestAnimationFrame(frame);
</script>
</body>
